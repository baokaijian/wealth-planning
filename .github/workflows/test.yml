name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Python syntax and repository hygiene
        run: |
          python -m py_compile app.py portfolio_engine.py update_data.py backtest.py scheduled_update.py
          git diff --check
