name: Update Live Market Data

on:
  schedule:
    # 工作日北京时间 17:30 主更新；20:30 再补跑一次，降低上游延迟或短暂网络失败造成的数据滞后。
    - cron: '30 9 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 允许在 GitHub Action 页面手动触发运行

permissions:
  contents: write

concurrency:
  group: update-live-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fetch, retry and validate market data
      run: |
        python scheduled_update.py --attempts 3 --base-delay 20

    - name: Run full regression checks
      run: |
        python -m unittest discover -s tests -p 'test_*.py'
        python tests/engine_consistency_check.py
        npm test

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add live_data.json strategy_presets.json
        if git diff --cached --quiet; then
          echo "No market data changes to commit."
          exit 0
        fi
        git commit -m "chore(data): update market yields and prices [skip ci]"
        git pull --rebase origin master
        git push origin master
