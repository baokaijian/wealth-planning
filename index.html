      --text-main: #F1F5F9;

      flex-shrink: 0;

    .logo-badge {

      height: 38px;

      color: #FFF;

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 2px;
    }

      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      overflow-x: auto;
      flex-shrink: 1;
      min-width: 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }
    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
    }
    .nav-tab-btn.active {
      color: #FFF;
      background: var(--primary);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.35);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .header-actions .btn {
      white-space: nowrap;
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .grid-8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    @media (max-width: 1400px) {
      .brand-subtitle { display: none; }
      .nav-tab-btn { padding: 6px 9px; font-size: 0.8rem; }
    }
    @media (max-width: 1160px) {
      .grid-8 { grid-template-columns: repeat(2, 1fr); }
      .grid-6 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .header-inner { padding: 8px 14px; gap: 10px; }
      .brand-title { font-size: 0.95rem; }
      .logo-badge { width: 32px; height: 32px; font-size: 16px; }
      .storage-text { display: none; }
      .header-actions { gap: 6px; }
      .header-actions .btn { padding: 4px 8px; font-size: 0.75rem; }
    }
    @media (max-width: 860px) {
      .grid-8, .grid-6, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .header-inner { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
      .logo-area { order: 1; }
      .header-actions { order: 2; margin-left: auto; }
      .nav-tabs { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }
    .card:hover {
      border-color: var(--card-hover-border);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

      font-size: 1.05rem;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 8px;

      font-weight: 600;

      border-radius: 6px;

      color: var(--text-main);

    tr:hover td {

      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;

    .tag-yellow { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-red { background: rgba(244, 63, 94, 0.15); color: #F87171; border: 1px solid rgba(244, 63, 94, 0.3); }
    .tag-blue { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .tag-purple { background: rgba(168, 85, 247, 0.15); color: #C084FC; border: 1px solid rgba(168, 85, 247, 0.3); }

    .pulse-dot {

      height: 8px;
      border-radius: 50%;
      background: var(--primary);

      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }

      font-size: 0.75rem;

    }
    .guide-module-card {

      padding: 16px;
      margin-bottom: 14px;

    .traffic-card.green { border-left: 4px solid #10B981; background: rgba(16, 185, 129, 0.08); }
  </style>

// ==========================================
// 状态平滑迁移器 (migrateState)
// ==========================================
function migrateState(stored) {
  if (!stored) return EMPTY_STATE;
  const legacy = !stored.meta;
  const base = legacy ? INITIAL_STATE : EMPTY_STATE;
  const migrated = {
    ...base,
    ...stored,
    meta: {
      ...base.meta,
      ...(stored.meta || {}),
      assessmentCompleted: stored.meta?.assessmentCompleted ?? true,
      isDemo: stored.meta?.isDemo ?? false,
      dataVersion: 2
    },
    quick: { ...base.quick, ...(stored.quick || {}) },
    board: {
      ...base.board,
      ...(stored.board || {}),
      assets: { ...base.board.assets, ...(stored.board?.assets || {}) }
    },
    health: { ...base.health, ...(stored.health || {}) },
    insurance: { ...base.insurance, ...(stored.insurance || {}) },
    debt: { ...base.debt, ...(stored.debt || {}) },
    pension: { ...base.pension, ...(stored.pension || {}) },
    property: { ...base.property, ...(stored.property || {}) },
    stress: { ...base.stress, ...(stored.stress || {}) },
    behavior: { ...base.behavior, ...(stored.behavior || {}) },
    thermometer: { ...base.thermometer, ...(stored.thermometer || {}) },
    goals: Array.isArray(stored.goals) ? stored.goals : base.goals
  };

  // 迁移老旧 bucket 字段至 A 组资产与 B 组确定性支出
  if (!migrated.health.assetsBreakdown) {
    migrated.health.assetsBreakdown = {
      cashCurrent: 100000,
      cashShortDebt: (migrated.health.bucket1To3y ?? 0),
      equityAssets: (migrated.board.principal ?? 0) * 10000 * 0.55,
      goldAssets: 56000,
      bondAssets: 184000,
      propertyEstimated: (migrated.property?.totalEstimatedValue ?? 0),
      pensionCashValue: 20000,
      otherAssets: 0
    };
  }
  if (!migrated.health.expectedExpenses) {
    migrated.health.expectedExpenses = {
      expense1y: (migrated.health.bucket1y ?? 0),
      expense1To3y: (migrated.health.bucket1To3y ?? 0),
      expense3To5y: (migrated.health.bucket3To5y ?? 0)
    };
  }
  // 利率中值与自定义利率防呆
  if (migrated.debt.customDebtRate === 5.5 && !migrated.debt.useCustomRate) {
    migrated.debt.customDebtRate = null;
    migrated.debt.useCustomRate = false;
  }
  if (migrated.debt.remainingYears === undefined) {
    migrated.debt.remainingYears = 15;
  }
  if (migrated.stress.unemploymentReplacementRate === undefined) {
    migrated.stress.unemploymentReplacementRate = 0.3;
  }
  if (!migrated.thermometer) {
    migrated.thermometer = { ...INITIAL_STATE.thermometer };
  } else {
    migrated.thermometer = {
      ...base.thermometer,
      ...migrated.thermometer,
      userHoldings: {
        ...base.thermometer.userHoldings,
        ...(migrated.thermometer.userHoldings || {})
      },
      percentileOverrides: {
        ...base.thermometer.percentileOverrides,
        ...(migrated.thermometer.percentileOverrides || {})
      }
    };
  }
  return migrated;
}

function numberOrDefault(value, fallback = 0) {
  if (value === undefined || value === null || value === '') return fallback;
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric : fallback;
}

/**
 * 资产配置看板核心指标测算
 */
function calculateBoardMetrics(boardState) {
  const { assets = {} } = boardState;
  const principal = numberOrDefault(boardState.principal, 0);
  const bufferSeed = numberOrDefault(boardState.bufferSeed, 0);
  const targetMonthly = numberOrDefault(boardState.targetMonthly, 1.2);
  const growthRate = numberOrDefault(boardState.growthRate, 6.5);
  const investPrincipal = Math.max(0, principal - bufferSeed); // 万元
  
  let totalWeight = 0;
  let blendedYield = 0;
  
  Object.values(assets).forEach(asset => {
    const w = numberOrDefault(asset.weight, 0) / 100.0;
    const y = numberOrDefault(asset.yield, 0) / 100.0;
    totalWeight += w;
    blendedYield += w * y;
  });

  const totalWeightPct = parseFloat((totalWeight * 100).toFixed(2));
  const isWeightValid = Math.abs(totalWeightPct - 100.0) < 0.01;

  const expectedAnnualDividend = investPrincipal * blendedYield * 10000; // 元
  const expectedMonthlyAvg = expectedAnnualDividend / 12.0; // 元
  const targetMonthlyYuan = targetMonthly * 10000; // 元
  const gapMonthly = targetMonthlyYuan - expectedMonthlyAvg;

  return {
    investPrincipal,
    totalWeight: totalWeightPct,
    blendedYield: parseFloat((blendedYield * 100).toFixed(2)),
    growthRate,
    expectedAnnualDividend: Math.round(expectedAnnualDividend),
    expectedMonthlyAvg: Math.round(expectedMonthlyAvg),
    targetMonthlyYuan: Math.round(targetMonthlyYuan),
    gapMonthly: Math.round(gapMonthly),
    isWeightValid
  };
}

/**
 * 现金缓冲池 36 个月逐月平滑模拟推演 (基础推演引擎)
 */
function calculateBufferSimulation(boardState, monthsRange = 36) {
  const { assets = {} } = boardState;
  const principal = numberOrDefault(boardState.principal, 0);
  const bufferSeed = numberOrDefault(boardState.bufferSeed, 0);
  const targetMonthly = numberOrDefault(boardState.targetMonthly, 1.2);
  const moneyMarketRate = numberOrDefault(boardState.moneyMarketRate, 2.0);
  const investPrincipalYuan = Math.max(0, principal - bufferSeed) * 10000;
  const targetMonthlyWithdraw = targetMonthly * 10000;
  const mmRate = moneyMarketRate / 100.0;

  let currentBuffer = bufferSeed * 10000;
  const timeline = [];
  let minBuffer = currentBuffer;
  let mostFragileMonth = 1;
  let totalDividends = 0;

  for (let t = 1; t <= monthsRange; t++) {
    const calendarMonth = ((t - 1) % 12) + 1;

    let monthDividend = 0;
    Object.values(assets).forEach(asset => {
      const distRatio = (asset.months && asset.months[calendarMonth]) || 0;
      if (distRatio > 0) {
        const assetVal = investPrincipalYuan * (numberOrDefault(asset.weight, 0) / 100.0);
        monthDividend += assetVal * (numberOrDefault(asset.yield, 0) / 100.0) * distRatio;
      }
    });

    const monthInterest = Math.max(0, currentBuffer) * (mmRate / 12.0);
    const nextBuffer = currentBuffer + monthDividend + monthInterest - targetMonthlyWithdraw;

    if (currentBuffer < minBuffer) {
      minBuffer = currentBuffer;
      mostFragileMonth = t;
    }

    timeline.push({
      monthIndex: t,
      calendarMonth,
      startBuffer: Math.round(currentBuffer),
      dividend: Math.round(monthDividend),
      interest: parseFloat(monthInterest.toFixed(1)),
      withdraw: Math.round(targetMonthlyWithdraw),
      endBuffer: Math.round(nextBuffer)
    });

    totalDividends += monthDividend;
    currentBuffer = nextBuffer;
  }

  const isBufferSafe = minBuffer >= 0;
  return {
    timeline,
    minBuffer: Math.round(minBuffer),
    mostFragileMonth,
    totalDividends: Math.round(totalDividends),
    isBufferSafe,
    averageMonthlyDividend: Math.round(totalDividends / monthsRange)
  };
}

/**
 * 单个目标推演与三大杠杆反解
 */
function calculateGoalProjection({
  currentYear = 2026,
  targetYear,
  targetAmount,
  monthlySurplus,
  growthRate = 6.5,
  currentPrincipal = 0,
  reservedAmount = 0,
  safeRate = 0.02
}) {
  currentYear = numberOrDefault(currentYear, 2026);
  targetYear = numberOrDefault(targetYear, currentYear + 1);
  targetAmount = numberOrDefault(targetAmount, 0);
  monthlySurplus = numberOrDefault(monthlySurplus, 0);
  growthRate = numberOrDefault(growthRate, 6.5);
  currentPrincipal = numberOrDefault(currentPrincipal, 0);
  reservedAmount = numberOrDefault(reservedAmount, 0);
  safeRate = numberOrDefault(safeRate, 0.02);
  const years = Math.max(1, targetYear - currentYear);
  const months = years * 12;
  const rAnnual = numberOrDefault(growthRate, 6.5) / 100.0;
  const rMonthly = rAnnual / 12.0;

  const fvPrincipal = currentPrincipal * Math.pow(1 + rAnnual, years);

  let fvMonthly = 0;
  if (rMonthly > 0) {
    fvMonthly = monthlySurplus * ((Math.pow(1 + rMonthly, months) - 1) / rMonthly) * (1 + rMonthly);
  } else {
    fvMonthly = monthlySurplus * months;
  }

  const fvReserved = reservedAmount * Math.pow(1 + safeRate, years);
  const fvTotal = fvPrincipal + fvMonthly + fvReserved;
  const diff = fvTotal - targetAmount;
  const isAchieved = diff >= 0;
  const gap = Math.max(0, -diff);

  let levers = null;
  if (gap > 0) {
    let extraMonthly = 0;
    if (rMonthly > 0) {
      const annuityFactor = ((Math.pow(1 + rMonthly, months) - 1) / rMonthly) * (1 + rMonthly);
      extraMonthly = Math.ceil(gap / annuityFactor);
    } else {
      extraMonthly = Math.ceil(gap / months);
    }

    let low = rAnnual;
    let high = 1.0;
    let reqRate = null;
    for (let iter = 0; iter < 100; iter++) {
      const mid = (low + high) / 2.0;
      const midMonthlyRate = mid / 12.0;
      const midFvP = currentPrincipal * Math.pow(1 + mid, years);
      let midFvM = 0;
      if (midMonthlyRate > 0) {
        midFvM = monthlySurplus * ((Math.pow(1 + midMonthlyRate, months) - 1) / midMonthlyRate) * (1 + midMonthlyRate);
      } else {
        midFvM = monthlySurplus * months;
      }
      const midTotal = midFvP + midFvM + fvReserved;
      if (Math.abs(midTotal - targetAmount) < 1.0) {
        reqRate = mid;
        break;
      } else if (midTotal < targetAmount) {
        low = mid;
      } else {
        high = mid;
      }
    }
    if (reqRate === null) reqRate = high;
    const rateDiffPct = (reqRate - rAnnual) * 100.0;
    const isRateSafe = reqRate <= 0.08;

    const loosenAmount = gap;
    let delayYears = null;
    for (let extraY = 1; extraY <= 30; extraY++) {
      const curY = years + extraY;
      const curM = curY * 12;
      const curFvP = currentPrincipal * Math.pow(1 + rAnnual, curY);
      let curFvM = 0;
      if (rMonthly > 0) {
        curFvM = monthlySurplus * ((Math.pow(1 + rMonthly, curM) - 1) / rMonthly) * (1 + rMonthly);
      } else {
        curFvM = monthlySurplus * curM;
      }
      const curFvR = reservedAmount * Math.pow(1 + safeRate, curY);
      if ((curFvP + curFvM + curFvR) >= targetAmount) {
        delayYears = extraY;
        break;
      }
    }

    levers = {
      extraMonthly,
      reqRate: parseFloat((reqRate * 100.0).toFixed(2)),
      rateDiffPct: parseFloat(rateDiffPct.toFixed(2)),
      isRateSafe,
      loosenAmount: Math.round(loosenAmount),
      delayYears: delayYears || 30,
      delayedTargetYear: (targetYear + (delayYears || 30))
    };
  }

  return {
    years,
    months,
    fvPrincipal: Math.round(fvPrincipal),
    fvMonthly: Math.round(fvMonthly),
    fvReserved: Math.round(fvReserved),
    fvTotal: Math.round(fvTotal),
    diff: Math.round(diff),
    isAchieved,
    gap: Math.round(gap),
    levers
  };
}

/**
 * P1-5 多目标资金排挤与资源池分配推演模型
 */
function calculateMultiGoalProjections(goals = [], totalInvestablePrincipal = 700000, totalMonthlySurplus = 12000, growthRate = 6.5, safeRate = 0.02) {
  totalInvestablePrincipal = numberOrDefault(totalInvestablePrincipal, 700000);
  totalMonthlySurplus = numberOrDefault(totalMonthlySurplus, 12000);
  growthRate = numberOrDefault(growthRate, 6.5);
  safeRate = numberOrDefault(safeRate, 0.02);
  // 1. 优先级排序：刚性优先，同级按到期年份由近及远
  const sorted = [...goals].map((g, idx) => ({ ...g, originalIndex: idx })).sort((a, b) => {
    if (a.priority === '刚性' && b.priority !== '刚性') return -1;
    if (a.priority !== '刚性' && b.priority === '刚性') return 1;
    return (a.targetYear || 2030) - (b.targetYear || 2030);
  });

  let remainingPrincipal = Math.max(0, totalInvestablePrincipal);
  let remainingSurplus = Math.max(0, totalMonthlySurplus);

  const goalResults = [];
  let totalAllocatedPrincipal = 0;
  let totalAllocatedSurplus = 0;

  sorted.forEach(goal => {
    const years = Math.max(1, (goal.targetYear || 2030) - 2026);
    const months = years * 12;
    const rAnnual = growthRate / 100.0;
    const rMonthly = rAnnual / 12.0;

    // 预留金
    const reserved = numberOrDefault(goal.reservedAmount, 0);
    const fvReserved = reserved * Math.pow(1 + safeRate, years);

    // 目标总需缺口
    const netTargetNeeded = Math.max(0, numberOrDefault(goal.targetAmount, 0) - fvReserved);

    // 分配本金 (至多取所需或剩余池)
    let allocP = 0;
    if (remainingPrincipal > 0 && netTargetNeeded > 0) {
      const pNeededForTotal = netTargetNeeded / Math.pow(1 + rAnnual, years);
      allocP = Math.min(remainingPrincipal, Math.round(pNeededForTotal * 0.5)); // 50%本金贡献
    }

    // 分配月结余
    let allocS = 0;
    const fvPAlloc = allocP * Math.pow(1 + rAnnual, years);
    const remainingNeed = Math.max(0, netTargetNeeded - fvPAlloc);
    if (remainingSurplus > 0 && remainingNeed > 0) {
      const annuityFactor = rMonthly > 0 
        ? ((Math.pow(1 + rMonthly, months) - 1) / rMonthly) * (1 + rMonthly)
        : months;
      const surplusNeeded = Math.ceil(remainingNeed / annuityFactor);
      allocS = Math.min(remainingSurplus, surplusNeeded);
    }

    remainingPrincipal -= allocP;
    remainingSurplus -= allocS;
    totalAllocatedPrincipal += allocP;
    totalAllocatedSurplus += allocS;

    // 单目标推演
    const proj = calculateGoalProjection({
      currentYear: 2026,
      targetYear: goal.targetYear || 2030,
      targetAmount: numberOrDefault(goal.targetAmount, 0),
      monthlySurplus: allocS,
      growthRate,
      currentPrincipal: allocP,
      reservedAmount: reserved,
      safeRate
    });

    goalResults.push({
      ...goal,
      allocatedPrincipal: allocP,
      allocatedSurplus: allocS,
      projection: proj
    });
  });

  // 恢复原顺序
  goalResults.sort((a, b) => a.originalIndex - b.originalIndex);

  const isResourceCrowdedOut = remainingPrincipal <= 0 || remainingSurplus <= 0;
  return {
    goalResults,
    totalInvestablePrincipal,
    totalMonthlySurplus,
    totalAllocatedPrincipal,
    totalAllocatedSurplus,
    remainingPrincipal,
    remainingSurplus,
    isResourceCrowdedOut
  };
}

/**
 * 提前退休 85 岁全生命周期持久性推演
 */
function simulateEarlyRetirement({
  currentAge = 35,
  retireAge = 50,
  targetAmount = 2000000,
  projectedCapitalAtRetire = null,
  monthlyExpense = 10000,
  dividendYield = 4.8,
  bufferInterestRate = 2.0,
  endAge = 85
}) {
  const totalYears = Math.max(1, endAge - retireAge);
  const totalMonths = totalYears * 12;
  const startCapital = projectedCapitalAtRetire === null || projectedCapitalAtRetire === undefined
    ? numberOrDefault(targetAmount, 2000000)
    : Math.max(0, numberOrDefault(projectedCapitalAtRetire, 0));
  
  let capital = startCapital;
  let lowestCapital = capital;
  let mostFragileMonth = 1;
  let depletionMonth = null;
  let depletionAge = null;

  const seasonality = {
    1: 0.02, 2: 0.02, 3: 0.03, 4: 0.05,
    5: 0.15, 6: 0.25, 7: 0.30, 8: 0.10,
    9: 0.03, 10: 0.02, 11: 0.01, 12: 0.02
  };

  const divRate = numberOrDefault(dividendYield, 4.8) / 100.0;
  const intRate = numberOrDefault(bufferInterestRate, 2.0) / 100.0;

  for (let m = 1; m <= totalMonths; m++) {
    const calMonth = ((m - 1) % 12) + 1;
    const currentSimAge = retireAge + (m - 1) / 12.0;

    const divWeight = seasonality[calMonth] || (1.0 / 12.0);
    const monthlyDiv = capital * divRate * divWeight;
    const monthlyInterest = Math.max(0, capital) * (intRate / 12.0);

    capital = capital + monthlyDiv + monthlyInterest - monthlyExpense;

    if (capital < lowestCapital) {
      lowestCapital = capital;
      mostFragileMonth = m;
    }

    if (capital <= 0 && depletionMonth === null) {
      depletionMonth = m;
      depletionAge = parseFloat(currentSimAge.toFixed(1));
    }
  }

  const isSustainable = depletionMonth === null;
  return {
    totalYears,
    totalMonths,
    isSustainable,
    finalCapital: Math.round(capital),
    depletionAge,
    depletionMonth,
    lowestCapital: Math.round(lowestCapital),
    mostFragileMonth,
    mostFragileAge: parseFloat((retireAge + (mostFragileMonth - 1) / 12.0).toFixed(1))
  };
}

/**
 * P0-3, P1-4 债务决策对照核心测算（消除静默覆盖，统一利差正负符号）
 */
function calculateDebtDecisionMetrics(debtState = {}, growthRate = 6.5) {
  const bracketMedians = { '<3.5%': 3.0, '3.5-4.5%': 4.0, '4.5-6%': 5.25, '>6%': 7.2 };
  const bracket = debtState.debtRateBracket || '3.5-4.5%';
  const bracketMedian = numberOrDefault(bracketMedians[bracket], 4.0);

  // 修复 P0-3：仅在明确勾选或填入正自定义利率时取自定义，否则取档位中值
  const customDebtRate = numberOrDefault(debtState.customDebtRate, 0);
  const isUsingCustom = Boolean(debtState.useCustomRate && customDebtRate >= 0);
  const effectiveDebtRate = isUsingCustom ? customDebtRate : bracketMedian;
  const rateSourceLabel = isUsingCustom ? `自定义 ${effectiveDebtRate}%` : `档位中值 ${bracketMedian}%`;

  const normalizedGrowthRate = numberOrDefault(growthRate, 6.5);
  const conservativeYield = parseFloat((normalizedGrowthRate * 0.7).toFixed(2));
  
  // 修复 P1-4：利差定义为 投资保守回报 − 贷款成本
  // 利差 > 0: 投资赚得多 (正利差)；利差 < 0: 贷款成本高 (负利差)
  const spread = parseFloat((conservativeYield - effectiveDebtRate).toFixed(2));
  const uncertaintyMarginPct = 1.5;
  const spreadAbs = Math.abs(spread).toFixed(2);
  const spreadSign = spread >= 0 ? '+' : '-';
  const spreadLabel = spread >= 0 
    ? `正利差 +${spreadAbs}% (保守投资收益可覆盖贷款利息成本)`
    : `负利差 -${spreadAbs}% (贷款利息成本高于保守投资收益)`;

  let decisionType = 'neutral';
  let decisionText = '';

  // 贷款成本高出投资 2% 以上 -> 利差 < -2%
  if (effectiveDebtRate > conservativeYield + uncertaintyMarginPct) {
    decisionType = 'repay_first';
    decisionText = '优先清偿高息债务（相当于获得无风险的利差收益）';
  } else if (effectiveDebtRate < conservativeYield - uncertaintyMarginPct) {
    decisionType = 'invest_first';
    decisionText = '保持贷款、优先投资，但需确认现金流稳定性';
  } else {
    decisionType = 'neutral';
    decisionText = '两者皆可，优先级取决于风险偏好与流动性需求';
  }

  const hasHighInterestAlert = (debtState.highInterestDebtBalance > 0) || (bracket === '>6%') || (effectiveDebtRate > 6.0);
  const fundX = Math.max(0, numberOrDefault(debtState.availableFundX, 200000));
  const rDebt = effectiveDebtRate / 100.0;
  const rInvest = conservativeYield / 100.0;

  const horizons = [3, 5, 10];
  const comparisonTable = horizons.map(years => {
    const fvRepay = fundX * Math.pow(1 + rDebt, years);
    const fvInvest = fundX * Math.pow(1 + rInvest, years);
    const diff = fvRepay - fvInvest;
    const diffPct = fundX > 0 ? ((fvRepay - fvInvest) / fundX) * 100.0 : 0;

    const advantage = decisionType === 'repay_first'
      ? '提前还贷在当前假设下占优'
      : decisionType === 'invest_first'
        ? '投资在当前假设下占优'
        : '差异不具稳健优势';

    return {
      years,
      fundX,
      fvRepay: Math.round(fvRepay),
      fvInvest: Math.round(fvInvest),
      diff: Math.round(diff),
      diffPct: parseFloat(diffPct.toFixed(2)),
      advantage
    };
  });

  const totalDebtBalance = numberOrDefault(debtState.mortgageBalance, 0)
    + numberOrDefault(debtState.carLoanBalance, 0)
    + numberOrDefault(debtState.consumerLoanBalance, 0)
    + numberOrDefault(debtState.businessLoanBalance, 0);
  const monthlyDebtPayment = numberOrDefault(debtState.monthlyDebtPayment, 0);
  const remainingYears = numberOrDefault(debtState.remainingYears, 15);

  return {
    bracket,
    bracketMedian,
    effectiveDebtRate,
    isUsingCustom,
    rateSourceLabel,
    sourceBadge: rateSourceLabel,
    growthRate: normalizedGrowthRate,
    conservativeYield,
    spread,
    spreadSign,
    spreadLabel,
    decisionType,
    decisionText,
    uncertaintyMarginPct,
    assumptionNote: '投资收益为规划假设，并非保证；未计税费、交易摩擦、提前还款规则及收益路径波动，利差落入不确定区间时不作确定性选择。',
    hasHighInterestAlert,
    fundX,
    remainingYears,
    comparisonTable,
    totalDebtBalance,
    monthlyDebtPayment
  };
}

/**
 * P1-2 家庭保障缺口测算（取A组高流动性资产，意外险为寿险净缺口50%）
 */
function calculateInsuranceGap(healthState = {}, insuranceState = {}, totalDebtBalance = 0) {
  const stabilityMap = INSURANCE_STABILITY_CONFIG;
  const monthlyIncome = numberOrDefault(healthState.monthlyIncome, 30000);
  const annualIncome = monthlyIncome * 12;
  const essentialMonthly = numberOrDefault(healthState.essentialMonthlyExpense, 12000);
  const future10yExpense = essentialMonthly * 120; // 10年刚需

  // P1-2: 寿险扣除的流动资产取 A 组高流动性资产 (现金活期 + 货基短债)
  const assetsBreakdown = healthState.assetsBreakdown || {};
  const highLiquidAssets = numberOrDefault(assetsBreakdown.cashCurrent, 0) + numberOrDefault(assetsBreakdown.cashShortDebt, 0);

  // 子女教育金独立取数
  const childEduTarget = numberOrDefault(insuranceState.childEduTarget, 500000);

  // 1. 寿险总需求与净缺口
  const lifeTarget = Math.max(0, totalDebtBalance + future10yExpense + childEduTarget - highLiquidAssets);
  const existingLife = numberOrDefault(insuranceState.existingLifeCover, 0);
  const lifeGap = Math.max(0, lifeTarget - existingLife);

  // 2. 重疾险
  const stabKey = insuranceState.stabilityTier || 'medium';
  const stabConfig = stabilityMap[stabKey] || stabilityMap.medium;
  const critTarget = stabConfig.years * annualIncome + stabConfig.medical;
  const existingCrit = numberOrDefault(insuranceState.existingCritCover, 0);
  const critGap = Math.max(0, critTarget - existingCrit);

  // 3. 意外险：P1-2 修正为寿险净缺口的 50%
  const accidentTarget = Math.round(lifeGap * 0.5);
  const existingAccident = numberOrDefault(insuranceState.existingAccidentCover, 0);
  const accidentGap = Math.max(0, accidentTarget - existingAccident);

  const hasMillionMedical = Boolean(insuranceState.hasMillionMedical);
  const hasNetGap = (lifeGap > 0) || (critGap > 0) || (accidentGap > 0) || (!hasMillionMedical);
  const isCoverageSelfReportedWeak = insuranceState.coverageTier === 'none' || insuranceState.coverageTier === 'insufficient';
  const shouldWarnAndDowngrade = isCoverageSelfReportedWeak && hasNetGap;

  return {
    highLiquidAssets,
    liquidCashDeduction: highLiquidAssets,
    childEduTarget,
    lifeTarget: Math.round(lifeTarget),
    existingLife,
    lifeGap: Math.round(lifeGap),
    lifeGapIncomeMultiple: parseFloat((lifeGap / Math.max(1, annualIncome)).toFixed(1)),
    stabConfig,
    critTarget: Math.round(critTarget),
    existingCrit,
    critGap: Math.round(critGap),
    critGapIncomeMultiple: parseFloat((critGap / Math.max(1, annualIncome)).toFixed(1)),
    accidentTarget,
    existingAccident,
    accidentGap,
    hasMillionMedical,
    shouldWarnAndDowngrade
  };
}

/**
 * 个人养老金税优测算
 */
function calculatePensionTaxBenefit(pensionState = {}) {
  const deposited = Math.min(PENSION_ANNUAL_MAX, Math.max(0, numberOrDefault(pensionState.currentYearDeposited, 0)));
  const remainingQuota = Math.max(0, PENSION_ANNUAL_MAX - deposited);
  const taxRate = numberOrDefault(pensionState.marginalTaxRate, 0.20);

  const annualTaxSavingsForegone = Math.round(remainingQuota * taxRate);
  const cumulative20ySavings = Math.round(annualTaxSavingsForegone * 20);

  let guidanceText = '个人养老金优先用于长期养老储备，结合锁定期限、产品风险等级和退休现金流需要审慎选择。';
  if (taxRate <= 0.001) {
    guidanceText = '当前边际税率接近 0，税收抵扣收益有限；可先保障应急金，再按长期养老需求决定是否缴存。';
  } else if (remainingQuota <= 0) {
    guidanceText = '本年度个人养老金缴存额度已用足，继续养老储备可在普通账户中保持长期、分散和低成本配置。';
  } else if (!pensionState.hasAccount) {
    guidanceText = `尚未开户；若资金可长期锁定，可评估开户并利用剩余额度，预计本年可节税约 ¥${annualTaxSavingsForegone.toLocaleString()} 元。`;
  } else {
    guidanceText = `若现金流和应急储备充足，可评估补足剩余 ¥${remainingQuota.toLocaleString()} 元额度，预计本年可节税约 ¥${annualTaxSavingsForegone.toLocaleString()} 元。`;
  }

  return {
    hasAccount: Boolean(pensionState.hasAccount),
    deposited,
    remainingQuota,
    taxRate,
    annualTaxSavingsForegone,
    cumulative20ySavings,
    isTaxFreeTier: taxRate <= 0.001,
    guidanceText
  };
}

/**
 * P1-3 房产集中度强化与首付资金核验（双口径对比与极端下跌冲击）
 */
function calculateRealEstateRisk(propertyState = {}, healthState = {}, debtState = {}) {
  const propertyVal = Math.max(0, numberOrDefault(propertyState.totalEstimatedValue, 2800000));
  const mortgage = Math.max(0, numberOrDefault(debtState.mortgageBalance, 800000));
  const totalDebt = numberOrDefault(debtState.mortgageBalance, 0)
    + numberOrDefault(debtState.carLoanBalance, 0)
    + numberOrDefault(debtState.consumerLoanBalance, 0)
    + numberOrDefault(debtState.businessLoanBalance, 0);

  const breakdown = healthState.assetsBreakdown || {};
  const liquidFinancial = numberOrDefault(breakdown.cashCurrent, 0)
    + numberOrDefault(breakdown.cashShortDebt, 0)
    + numberOrDefault(breakdown.equityAssets, 0)
    + numberOrDefault(breakdown.goldAssets, 0)
    + numberOrDefault(breakdown.bondAssets, 0)
    + numberOrDefault(breakdown.otherAssets, 0);
  const pensionCashValue = numberOrDefault(breakdown.pensionCashValue, 0);

  const familyTotalAssets = liquidFinancial + propertyVal + pensionCashValue;
  const familyTotalNetWorth = familyTotalAssets - totalDebt;

  const propertyNet = Math.max(0, propertyVal - mortgage);
  const ratio = familyTotalNetWorth > 0
    ? parseFloat(((propertyNet / familyTotalNetWorth) * 100.0).toFixed(1))
    : (propertyNet > 0 ? 100 : 0);

  let tier = 'green';
  let tierLabel = '安全适中 (<60%)';
  if (ratio > PROPERTY_THRESHOLDS.yellowMax * 100) {
    tier = 'red';
    tierLabel = '高危过重 (>75%)';
  } else if (ratio >= PROPERTY_THRESHOLDS.greenMax * 100) {
    tier = 'yellow';
    tierLabel = '偏高关注 (60-75%)';
  }
  const tierAdvice = tier === 'red'
    ? '房产净值占家庭净资产比例过高，建议优先增加高流动性金融资产，避免继续放大房产集中风险。'
    : (tier === 'yellow'
      ? '房产占比偏高，新增结余宜优先配置流动金融资产，并审慎评估新增按揭。'
      : '房产占家庭净资产比例处于可控区间，继续保持住房与流动金融资产的平衡。');

  // 首付校验
  const hasHousePlan = Boolean(healthState.hasHousePlan);
  const expectedDownPayment = Math.max(0, numberOrDefault(healthState.expectedDownPayment, 600000));
  const readyFunds = numberOrDefault(breakdown.cashCurrent, 0) + numberOrDefault(breakdown.cashShortDebt, 0);
  const downPaymentGap = Math.max(0, expectedDownPayment - readyFunds);
  const isDownPaymentShort = hasHousePlan && downPaymentGap > 0;
  const downPaymentWarning = isDownPaymentShort
    ? '首付准备金不足，不能用中长期或高波动投资资产替代，应先补足确定性资金。'
    : '首付准备金未发现缺口。';

  // P1-3 房产下跌 20% 冲击
  const stressDropPct = Math.max(0, numberOrDefault(propertyState.stressDropPct, 20));
  const propertyLoss = Math.round(propertyVal * (stressDropPct / 100.0));
  const stressTotalAssets = Math.max(0, familyTotalAssets - propertyLoss);
  const stressNetWorth = Math.max(0, familyTotalNetWorth - propertyLoss);
  const stressDebtToAssetRatio = stressTotalAssets > 0
    ? parseFloat(((totalDebt / stressTotalAssets) * 100.0).toFixed(1))
    : (totalDebt > 0 ? 100 : 0);
  const normalDebtToAssetRatio = familyTotalAssets > 0
    ? parseFloat(((totalDebt / familyTotalAssets) * 100.0).toFixed(1))
    : (totalDebt > 0 ? 100 : 0);

  // 双口径对比
  // 口径 A: 含房产
  const perspectiveA = {
    totalAssets: familyTotalAssets,
    totalDebt,
    netWorth: familyTotalNetWorth,
    debtRatio: normalDebtToAssetRatio
  };
  // 口径 B: 纯金融（不含房产与房贷）
  const pureFinancialAssets = liquidFinancial + pensionCashValue;
  const nonMortgageDebt = Math.max(0, totalDebt - mortgage);
  const pureFinancialNetWorth = pureFinancialAssets - nonMortgageDebt;
  const pureFinancialDebtRatio = pureFinancialAssets > 0 ? parseFloat(((nonMortgageDebt / pureFinancialAssets) * 100.0).toFixed(1)) : 0;

  const perspectiveB = {
    pureFinancialAssets,
    nonMortgageDebt,
    pureFinancialNetWorth,
    pureFinancialDebtRatio
  };

  return {
    propertyVal,
    mortgage,
    propertyNet,
    familyTotalAssets,
    familyTotalNetWorth,
    ratio,
    tier,
    tierLabel,
    tierAdvice,
    hasHousePlan,
    expectedDownPayment,
    readyFunds,
    downPaymentGap,
    isDownPaymentShort,
    downPaymentWarning,
    perspectiveA,
    perspectiveB,
    stressDropPct,
    propertyLoss,
    stressTotalAssets,
    stressNetWorth,
    normalDebtToAssetRatio,
    stressDebtToAssetRatio,
    // 稳定的报告/UI 契约；保留上方明细字段作为兼容接口。
    totalAssets: familyTotalAssets,
    totalDebt,
    totalNetWorth: familyTotalNetWorth,
    financialAssets: pureFinancialAssets,
    financialDebt: nonMortgageDebt,
    financialNetWorth: pureFinancialNetWorth,
    normalDebtToAsset: normalDebtToAssetRatio,
    financialDebtRatio: pureFinancialDebtRatio,
    stressDebtToAsset: stressDebtToAssetRatio,
    realEstateRatio: ratio,
    stressDropAmount: propertyLoss,
    stressTotalNetWorth: stressNetWorth
  };
}

/**
 * P1-1 流动性硬隔离校验（A组资产与B组支出彻底解耦）
 */
function checkLiquiditySegregation(healthState = {}, boardPrincipalTenThousand = 80) {
  const breakdown = healthState.assetsBreakdown || {};
  const liquidFinancialAssets = numberOrDefault(breakdown.cashCurrent, 0)
    + numberOrDefault(breakdown.cashShortDebt, 0)
    + numberOrDefault(breakdown.equityAssets, 0)
    + numberOrDefault(breakdown.goldAssets, 0)
    + numberOrDefault(breakdown.bondAssets, 0)
    + numberOrDefault(breakdown.otherAssets, 0);

  const expenses = healthState.expectedExpenses || {};
  const expense1y = numberOrDefault(expenses.expense1y, 100000);
  const expense1To3y = numberOrDefault(expenses.expense1To3y, 150000);

  // 可投资上限 = 流动金融资产 - 12m*100% - 1-3y*50%
  const investableCeiling = Math.max(0, liquidFinancialAssets - (expense1y * 1.0) - (expense1To3y * LIQUIDITY_DISCOUNT_FACTOR));
  const boardPrincipalYuan = numberOrDefault(boardPrincipalTenThousand, 80) * 10000;
  const isViolated = boardPrincipalYuan > investableCeiling;
  const excessAmount = Math.max(0, boardPrincipalYuan - investableCeiling);

  const shortTermExpenses = expense1y + expense1To3y;
  const coverageRatio = shortTermExpenses > 0 ? parseFloat((liquidFinancialAssets / shortTermExpenses).toFixed(2)) : 99.0;
  const isCoverageInsufficient = coverageRatio < LIQUIDITY_SAFE_COVERAGE_RATIO;

  return {
    liquidFinancialAssets,
    expense1y,
    expense1To3y,
    bucket1y: expense1y,
    bucket1To3y: expense1To3y,
    discountFactor: LIQUIDITY_DISCOUNT_FACTOR,
    investableCeiling: Math.round(investableCeiling),
    boardPrincipalYuan,
    isViolated,
    excessAmount: Math.round(excessAmount),
    warningText: isViolated ? `当前本金侵占未来确定性刚需，超限 ¥${Math.round(excessAmount).toLocaleString()} 元，建议调减投资本金或压缩短期预算！` : '可用投资本金处于安全可控限额内。',
    distinctionNote: '流动性硬隔离（资产体检）：防范本金侵入1-3年确定性大额刚需；现金缓冲池（看板）：防范月度必要生活开支与分红淡旺季错配。两者定位严格互补。',
    coverageRatio,
    isCoverageInsufficient
  };
}

/**
 * 三重集中度检查
 */
function checkTripleConcentration(assets = {}) {
  const assetList = Object.entries(assets).map(([code, item]) => ({
    code,
    name: item.name,
    weight: item.weight || 0,
    market: item.market || 'A股',
    category: item.category || 'Equity',
    style: item.style || '其他'
  }));

  // 1. 标的集中度
  const sorted = [...assetList].sort((a, b) => b.weight - a.weight);
  const maxSingle = sorted[0] || { name: '无', weight: 0 };
  const top3Weight = parseFloat(sorted.slice(0, 3).reduce((acc, cur) => acc + cur.weight, 0).toFixed(1));

  const isSingleWarn = maxSingle.weight > CONCENTRATION_LIMITS.singleAssetYellow;
  const isTop3Danger = top3Weight > CONCENTRATION_LIMITS.top3AssetsRed;

  let targetStatus = 'green';
  let targetAdvice = '标的分布分散均匀，单一资产黑天鹅冲击可控。';
  if (isTop3Danger) {
    targetStatus = 'red';
    targetAdvice = `前三大标的合计权重达到 ${top3Weight}% (红灯>70%)，需防范极端踩踏。`;
  } else if (isSingleWarn) {
    targetStatus = 'yellow';
    targetAdvice = `单一标的【${maxSingle.name}】达 ${maxSingle.weight.toFixed(1)}% (黄灯>40%)，单资产冲击显著。`;
  }

  // 2. 市场集中度
  const marketSums = {};
  assetList.forEach(a => {
    marketSums[a.market] = (marketSums[a.market] || 0) + a.weight;
  });
  let maxMarket = { market: 'A股', weight: 0 };
  Object.entries(marketSums).forEach(([m, w]) => {
    if (w > maxMarket.weight) maxMarket = { market: m, weight: parseFloat(w.toFixed(1)) };
  });

  const isMarketAlert = maxMarket.weight > CONCENTRATION_LIMITS.marketCurrencyAlert;
  let marketStatus = isMarketAlert ? 'yellow' : 'green';
  let marketAdvice = isMarketAlert 
    ? `【${maxMarket.market}】资产占比高达 ${maxMarket.weight}% (>60%)，建议适度跨市场分散。`
    : '多市场均衡分布，宏观主权风险分散良好。';

  // 3. 策略风格集中度 (红利低波)
  let dividendStyleWeight = 0;
  assetList.forEach(a => {
    if (a.style === '红利低波') dividendStyleWeight += a.weight;
  });
  dividendStyleWeight = parseFloat(dividendStyleWeight.toFixed(1));

  const isStyleAlert = dividendStyleWeight > CONCENTRATION_LIMITS.dividendStyleClusterAlert;
  let styleStatus = isStyleAlert ? 'yellow' : 'green';
  let styleAdvice = isStyleAlert
    ? `红利低波类标的权重达 ${dividendStyleWeight}% (>50%)，需注意银行/煤炭行业周期共振风险。`
    : '风格保持多元平衡。';

  return {
    targetStatus,
    targetAdvice,
    maxSingle,
    top3Weight,
    marketStatus,
    marketAdvice,
    maxMarket,
    styleStatus,
    styleAdvice,
    dividendStyleWeight
  };
}

/**
 * P0-4 行为约束引擎（严格按 category === 'Equity' 统计实际权益权重）
 */
function calculateBehavioralEquityCeiling(behaviorState = {}, assets = {}) {
  const bracket = behaviorState.drawdownBracket || '10-20%';
  const baseCeiling = BEHAVIOR_DRAWDOWN_MAP[bracket] || 55;

  const reaction = behaviorState.marketDropReaction || 'panic_sell';
  const panicDeduction = BEHAVIOR_RULES.panicReactionDeduction[reaction] || 0;
  const cashflowDeduction = behaviorState.cashflowRelianceHigh ? BEHAVIOR_RULES.cashflowRelianceDeduction : 0;
  const industryDeduction = behaviorState.industryVolatileHigh ? BEHAVIOR_RULES.industryVolatileDeduction : 0;

  const rawCeiling = baseCeiling - panicDeduction - cashflowDeduction - industryDeduction;
  const finalCeiling = Math.max(BEHAVIOR_RULES.floorProtection, rawCeiling);

  // P0-4 严格按 category === 'Equity' 判定实际权益
  let actualEquityWeight = 0;
  Object.values(assets).forEach(a => {
    if (a.category === 'Equity') {
      actualEquityWeight += (a.weight || 0);
    }
  });
  actualEquityWeight = parseFloat(actualEquityWeight.toFixed(1));

  const isExceeded = actualEquityWeight > finalCeiling;
  const excessWeight = parseFloat(Math.max(0, actualEquityWeight - finalCeiling).toFixed(1));
  const implicitDrawdown = parseFloat((finalCeiling * BEHAVIOR_RULES.extremeEquityDrawdown).toFixed(1));

  const breakdownList = [
    { label: `自评回撤档位 (${bracket}) 基础权益上限`, delta: `+${baseCeiling}%` }
  ];
  if (panicDeduction > 0) breakdownList.push({ label: '市场大跌第一反应 (恐慌卖出/观望)', delta: `-${panicDeduction}%` });
  if (cashflowDeduction > 0) breakdownList.push({ label: '日常现金流高度依赖投资收益', delta: `-${cashflowDeduction}%` });
  if (industryDeduction > 0) breakdownList.push({ label: '行业波动大且失业恢复期预期>6个月', delta: `-${industryDeduction}%` });
  if (rawCeiling < BEHAVIOR_RULES.floorProtection) breakdownList.push({ label: `触发工具安全保护底线 (${BEHAVIOR_RULES.floorProtection}%)`, delta: '兜底提升' });

  return {
    bracket,
    baseCeiling,
    panicDeduction,
    cashflowDeduction,
    industryDeduction,
    finalCeiling,
    actualEquityWeight,
    isExceeded,
    excessWeight,
    implicitDrawdown,
    breakdownList,
    warningText: "超出您的行为风险约束！您自评的心理抗跌能力与家庭现金流刚性，无法承载当前高比例权益波动。"
  };
}

/**
 * P2-1 估值温度计（修复 20% 边界归入低估而非深度低估）
 */
function calculateThermometerSignal(percentile = 50) {
  const val = Math.min(100, Math.max(0, percentile));
  let code = 'neutral';
  
  // 修复边界：< 20 为深度低估；20 <= val < 40 为低估
  if (val < 20) code = 'deep_low';
  else if (val < 40) code = 'low';
  else if (val < 60) code = 'neutral';
  else if (val < 80) code = 'warm';
  else code = 'overheat';

  const tier = THERMOMETER_TIERS.find(t => t.code === code) || THERMOMETER_TIERS[2];

  // 动态定投调节因子
  let dcaFactor = 1.0;
  if (code === 'deep_low') dcaFactor = 1.5;
  else if (code === 'low') dcaFactor = 1.2;
  else if (code === 'neutral') dcaFactor = 1.0;
  else if (code === 'warm') dcaFactor = 0.5;
  else if (code === 'overheat') dcaFactor = 0.0;

  return {
    percentile: val,
    code,
    tier,
    dcaFactor,
    dcaMultiplier: dcaFactor,
    isOverheated: code === 'overheat',
    isDeepLow: code === 'deep_low',
    actionAdvice: tier.action,
    rebalanceAdvice: code === 'overheat' 
      ? '过热预警：建议启动卖出侧纪律，分批止盈并再平衡至防守桶'
      : (code === 'deep_low' ? '黄金买点：定投力度加码，摊薄中长期持仓成本' : '保持常规纪律操作')
  };
}

/**
 * P2-2 增量资金再平衡分配算法
 */
function calculateIncrementalRebalance(assets = {}, userHoldings = {}, incrementalCapital = 50000) {
  const safeHoldings = userHoldings || {};
  incrementalCapital = Math.max(0, numberOrDefault(incrementalCapital, 50000));
  // 计算当前持仓市值
  let totalCurrentValYuan = 0;
  const holdingList = Object.entries(assets || {}).map(([code, asset]) => {
    const valWan = Number(safeHoldings[code] ?? 0);
    const valYuan = valWan * 10000;
    totalCurrentValYuan += valYuan;
    return {
      code,
      name: asset.name,
      targetWeight: numberOrDefault(asset.weight, 0),
      targetPct: numberOrDefault(asset.weight, 0),
      valYuan
    };
  });

  const totalAfterCapital = totalCurrentValYuan + incrementalCapital;

  // 识别低配标的
  const rebalanceItems = holdingList.map(item => {
    const currentWeight = totalCurrentValYuan > 0 ? (item.valYuan / totalCurrentValYuan) * 100.0 : item.targetWeight;
    const weightDiff = currentWeight - item.targetWeight; // 实际 - 目标
    const idealValAfter = totalAfterCapital * (item.targetWeight / 100.0);
    const neededGap = Math.max(0, idealValAfter - item.valYuan); // 补齐目标还需资金

    return {
      ...item,
      currentWeight: parseFloat(currentWeight.toFixed(1)),
      currentPct: parseFloat(currentWeight.toFixed(1)),
      weightDiff: parseFloat(weightDiff.toFixed(1)),
      diffPct: parseFloat(weightDiff.toFixed(1)),
      status: weightDiff > 2.0 ? 'overweight' : (weightDiff < -2.0 ? 'underweight' : 'balanced'),
      neededGap
    };
  });

  const totalNeededGaps = rebalanceItems.reduce((acc, cur) => acc + cur.neededGap, 0);

  // 增量资金全额分配至低配标的
  const allocation = rebalanceItems.map(item => {
    let allocatedYuan = 0;
    if (totalNeededGaps > 0 && item.neededGap > 0) {
      allocatedYuan = Math.round((item.neededGap / totalNeededGaps) * incrementalCapital);
    }
    return {
      ...item,
      allocatedYuan,
      allocatedCash: allocatedYuan
    };
  });

  return {
    totalCurrentValYuan,
    totalAfterCapital,
    incrementalCapital,
    allocation,
    allocations: allocation
  };
}

/**
 * P0-1, P0-2 复合情景压力测试推演引擎（失业期收入减损 + 真实逐月回撤）
 */
function runCompoundStressTest(boardState = {}, stressScenario = {}, healthState = {}, monthsRange = 36) {
  const { assets = {} } = boardState;
  const principal = numberOrDefault(boardState.principal, 0);
  const bufferSeed = numberOrDefault(boardState.bufferSeed, 0);
  const targetMonthly = numberOrDefault(boardState.targetMonthly, 1.2);
  const moneyMarketRate = numberOrDefault(boardState.moneyMarketRate, 2.0);
  const investPrincipalYuan = Math.max(0, principal - bufferSeed) * 10000;
  const mmRate = moneyMarketRate / 100.0;

  const unemploymentMonths = numberOrDefault(stressScenario.unemploymentMonths, 0);
  const replacementRate = numberOrDefault(
    stressScenario.unemploymentReplacementRate,
    numberOrDefault(healthState.unemploymentReplacementRate, 0.3)
  );

  const monthlyIncome = numberOrDefault(healthState.monthlyIncome, 30000);
  const essentialExpense = numberOrDefault(healthState.essentialMonthlyExpense, 12000);
  // P0-1 失业期每月收入减损造成的额外现金流出
  const unemploymentLossPerMonth = Math.max(0, essentialExpense - (monthlyIncome * replacementRate));

  const dividendDropRate = numberOrDefault(stressScenario.dividendDropRate, 0);
  const delayMonths = numberOrDefault(stressScenario.delayMonths, 0);
  const medicalExpense = numberOrDefault(stressScenario.medicalExpense, 0);
  const medicalMonth = numberOrDefault(stressScenario.medicalMonth, 6);
  const inflationRate = numberOrDefault(stressScenario.inflationRate, 0);

  // P0-2 历史回放时序回撤与分红系数
  const monthlyDrawdowns = stressScenario.monthlyDrawdown || null;
  const replayDividendFactor = numberOrDefault(stressScenario.dividendFactor, 1.0);
  const defaultEquityDrawdown = numberOrDefault(stressScenario.equityDrawdownRate, 0.20);

  let currentBuffer = bufferSeed * 10000;
  const timeline = [];
  let minBuffer = currentBuffer;
  let exhaustionMonth = null;
  let maxDeficit = 0;
  let worstDeficitMonth = 1;

  for (let t = 1; t <= monthsRange; t++) {
    const calendarMonth = ((t - 1) % 12) + 1;
    let baseMonthlyWithdraw = targetMonthly * 10000;
    if (inflationRate > 0) {
      baseMonthlyWithdraw = baseMonthlyWithdraw * Math.pow(1 + inflationRate / 12.0, t);
    }

    // P0-1 失业期收入减损生效
    const isUnemployed = t <= unemploymentMonths;
    const unemploymentLoss = isUnemployed ? unemploymentLossPerMonth : 0;

    let extraMedical = 0;
    if (medicalExpense > 0 && t === medicalMonth) {
      extraMedical = medicalExpense;
    }

    const totalOutflow = baseMonthlyWithdraw + unemploymentLoss + extraMedical;

    // 分红到账
    let monthDividend = 0;
    const effectiveCalMonth = delayMonths > 0 ? ((((calendarMonth - 1 - delayMonths) % 12) + 12) % 12) + 1 : calendarMonth;

    Object.values(assets).forEach(asset => {
      const distRatio = (asset.months && asset.months[effectiveCalMonth]) || 0;
      if (distRatio > 0) {
        const assetVal = investPrincipalYuan * (numberOrDefault(asset.weight, 0) / 100.0);
        const baseDiv = assetVal * (numberOrDefault(asset.yield, 0) / 100.0) * distRatio;
        monthDividend += baseDiv * (1 - dividendDropRate) * replayDividendFactor;
      }
    });

    const monthInterest = Math.max(0, currentBuffer) * (mmRate / 12.0);
    const nextBuffer = currentBuffer + monthDividend + monthInterest - totalOutflow;

    if (currentBuffer < minBuffer) minBuffer = currentBuffer;
    if (nextBuffer < 0 && exhaustionMonth === null) exhaustionMonth = t;
    if (nextBuffer < 0 && Math.abs(nextBuffer) > maxDeficit) {
      maxDeficit = Math.abs(nextBuffer);
      worstDeficitMonth = t;
    }

    // P0-2 当月时序回撤
    let currentDrawdown = defaultEquityDrawdown;
    if (Array.isArray(monthlyDrawdowns) && monthlyDrawdowns.length > 0) {
      const idx = Math.min(t - 1, monthlyDrawdowns.length - 1);
      currentDrawdown = Math.abs(monthlyDrawdowns[idx]);
    }

    timeline.push({
      month: t,
      calendarMonth,
      isUnemployed,
      unemploymentLoss: Math.round(unemploymentLoss),
      startBuffer: Math.round(currentBuffer),
      dividend: Math.round(monthDividend),
      interest: parseFloat(monthInterest.toFixed(1)),
      withdraw: Math.round(totalOutflow),
      medicalExpense: extraMedical,
      endBuffer: Math.round(nextBuffer),
      drawdownRate: currentDrawdown
    });

    currentBuffer = nextBuffer;
  }

  // P0-2 变现资产规模按最深亏空时点的回撤折算
  const worstTimelineItem = timeline[worstDeficitMonth - 1];
  const worstMonthDrawdown = worstTimelineItem
    ? numberOrDefault(worstTimelineItem.drawdownRate, defaultEquityDrawdown)
    : defaultEquityDrawdown;
  const discountMultiplier = Math.max(0.1, 1 - worstMonthDrawdown);
  const minAssetToSell = exhaustionMonth ? Math.round(maxDeficit / discountMultiplier) : 0;

  const monthlySurplusYuan = numberOrDefault(healthState.monthlySurplus, 12000);
  const targetBufferTarget = bufferSeed * 10000;
  const deficitToFill = exhaustionMonth ? (targetBufferTarget + maxDeficit) : 0;
  const monthsToRecover = deficitToFill > 0 ? Math.ceil(deficitToFill / Math.max(1000, monthlySurplusYuan)) : 0;

  return {
    timeline,
    minBuffer: Math.round(minBuffer),
    exhaustionMonth,
    isExhausted: exhaustionMonth !== null,
    minAssetToSell,
    monthsToRecover,
    maxDeficit: Math.round(maxDeficit),
    unemploymentLossPerMonth: Math.round(unemploymentLossPerMonth),
    unemploymentLossTotal: Math.round(unemploymentLossPerMonth * unemploymentMonths),
    unemploymentMonths,
    worstMonthDrawdown
  };
}

/**
 * P1-6, P1-7 评分体系重构（7因子脆弱性归因 + 4客观行为进攻性评分）
 */
function calculateExplainableScores(state = {}) {
  const { board = {}, health = {}, debt = {}, insurance = {}, behavior = {} } = state;
  const boardMetrics = calculateBoardMetrics(board);
  const bufferSim = calculateBufferSimulation(board);
  const debtMetrics = calculateDebtDecisionMetrics(debt, board.growthRate);
  const insGap = calculateInsuranceGap(health, insurance, debtMetrics.totalDebtBalance);
  const liqCheck = checkLiquiditySegregation(health, board.principal);
  const behCheck = calculateBehavioralEquityCeiling(behavior, board.assets);

  // ==========================================
  // 一、脆弱性评分 (0 - 100 分，越低越稳健，满分100代表极度脆弱)
  // 7 大明确子因子
  // ==========================================
  // 1. 高息债务与债务总杠杆 (0-20分)
  let fDebt = 0;
  if (debtMetrics.hasHighInterestAlert) fDebt = 20;
  else if (debtMetrics.totalDebtBalance > 1500000) fDebt = 14;
  else if (debtMetrics.totalDebtBalance > 0) fDebt = 7;

  // 2. 月供占月收入比 (0-15分)
  const monthlyIncome = healthStateIncome(health);
  const repayRatio = monthlyIncome > 0 ? ((debtMetrics.monthlyDebtPayment || 0) / monthlyIncome) : 0;
  let fRepay = 0;
  if (repayRatio > 0.5) fRepay = 15;
  else if (repayRatio > 0.35) fRepay = 9;
  else if (repayRatio > 0) fRepay = 4;

  // 3. 流动性硬隔离违规与备用金覆盖 (0-20分)
  let fLiq = 0;
  if (liqCheck.isViolated) fLiq = 20;
  else if (liqCheck.isCoverageInsufficient) fLiq = 12;
  else fLiq = 3;

  // 4. 收入结构单一性 (0-15分)
  const incSource = health.incomeSourceCount || 'single';
  let fInc = 0;
  if (incSource === 'single') fInc = 15;
  else if (incSource === 'dual') fInc = 8;
  else fInc = 2; // multiple

  // 5. 预期失业恢复期 (0-10分)
  const recMonths = numberOrDefault(health.unemploymentRecoveryMonths, 6);
  let fRec = 0;
  if (recMonths > 6) fRec = 10;
  else if (recMonths >= 3) fRec = 5;
  else fRec = 0;

  // 6. 保障缺口敞口与百万医疗兜底 (0-10分)
  let fIns = 0;
  if (insGap.shouldWarnAndDowngrade) fIns = 10;
  else if (insGap.lifeGap > 0 || insGap.critGap > 0 || !insGap.hasMillionMedical) fIns = 6;

  // 7. 缓冲池淡旺季平滑最低水位 (0-10分)
  let fBuf = 0;
  if (!bufferSim.isBufferSafe) fBuf = 10;
  else if (bufferSim.minBuffer < 30000) fBuf = 5;

  const totalVulnerability = fDebt + fRepay + fLiq + fInc + fRec + fIns + fBuf;

  const vulnFactors = [
    { name: '高息与综合债务杠杆', score: fDebt, max: 20, desc: debtMetrics.hasHighInterestAlert ? '存在高息债务或利率>6%' : `总负债 ¥${debtMetrics.totalDebtBalance.toLocaleString()}元` },
    { name: '还贷月供收入比', score: fRepay, max: 15, desc: `月供占比 ${(repayRatio * 100).toFixed(1)}%` },
    { name: '流动性硬隔离与应急覆盖', score: fLiq, max: 20, desc: liqCheck.isViolated ? `超限违规 ¥${liqCheck.excessAmount.toLocaleString()}元` : `覆盖倍数 ${liqCheck.coverageRatio}x` },
    { name: '家庭收入结构多元性', score: fInc, max: 15, desc: incSource === 'single' ? '单薪依赖度高' : (incSource === 'dual' ? '双薪家庭' : '多元收入来源') },
    { name: '失业恢复期预期', score: fRec, max: 10, desc: `恢复期预期 ${recMonths} 个月` },
    { name: '家庭人身保障缺口与医疗兜底', score: fIns, max: 10, desc: insGap.shouldWarnAndDowngrade ? '自评不足且有缺口' : (insGap.hasMillionMedical ? '保障齐备' : '缺百万医疗') },
    { name: '缓冲池淡旺季平滑', score: fBuf, max: 10, desc: !bufferSim.isBufferSafe ? '出现亏空断流' : `最低水位 ¥${bufferSim.minBuffer.toLocaleString()}` }
  ];

  vulnFactors.sort((a, b) => (b.score / b.max) - (a.score / a.max));
  const worstVulnFactor = vulnFactors[0];

  // ==========================================
  // 二、理财进攻性评分 (0 - 100 分，纯客观行为持仓重构)
  // 4 大客观子因子
  // ==========================================
  // 1. 严格权益持仓占比 (0-35分)
  const equityWeight = behCheck.actualEquityWeight;
  const fEq = Math.min(35, Math.round((equityWeight / 100.0) * 35));

  // 2. 高波动与海外市场暴露 (0-25分)
  let highVolWeight = 0;
  Object.values(board.assets || {}).forEach(a => {
    if (a.market === '港股' || a.market === '美股' || a.style === '成长' || a.style === '科创') {
      highVolWeight += (a.weight || 0);
    }
  });
  const fVol = Math.min(25, Math.round((highVolWeight / 100.0) * 25));

  // 3. 杠杆水平与高息博取 (0-20分)
  let fLev = 0;
  if (debtMetrics.hasHighInterestAlert) fLev = 20;
  else if (repayRatio > 0.4) fLev = 14;
  else if (debtMetrics.totalDebtBalance > 0) fLev = 8;

  // 4. 超越行为约束上限博取度 (0-20分)
  const fExceed = behCheck.isExceeded ? Math.min(20, Math.round(behCheck.excessWeight * 1.5)) : 0;

  const totalAggressiveness = Math.min(100, fEq + fVol + fLev + fExceed);

  const aggFactors = [
    { name: '严格口径权益持仓权重', score: fEq, max: 35, desc: `权益配置比例 ${equityWeight}%` },
    { name: '高波动与海外市场暴露', score: fVol, max: 25, desc: `高波动/海外占比 ${highVolWeight.toFixed(1)}%` },
    { name: '家庭债务杠杆博取度', score: fLev, max: 20, desc: `月供占比 ${(repayRatio * 100).toFixed(1)}%` },
    { name: '突破行为约束上限超配度', score: fExceed, max: 20, desc: behCheck.isExceeded ? `超配上限 ${behCheck.excessWeight}%` : '未超越约束' }
  ];

  return {
    totalVulnerability,
    vulnerabilityLevel: totalVulnerability > 60 ? '高危脆弱' : (totalVulnerability > 35 ? '中度脆弱' : '稳健安全'),
    vulnFactors,
    worstVulnConclusion: `本期【${worstVulnFactor.name}】得分为 ${worstVulnFactor.score}分 (满分${worstVulnFactor.max}分)，是推高家庭财务脆弱性的首要短板。`,
    totalAggressiveness,
    aggressivenessLevel: totalAggressiveness > 70 ? '激进进攻' : (totalAggressiveness > 40 ? '平衡进取' : '谨慎保守'),
    aggFactors
  };
}

    // ==========================================

    // ==========================================
// 家庭快速评估纯函数模型。金额单位统一为元，比例输入统一为百分数。

const RISK_LABELS = {
  1: '保守',
  2: '稳健',
  3: '均衡',
  4: '成长',
  5: '积极',
};

const LIFECYCLE_CONFIG = {

  near_retirement: { title: '临近退休家庭', emergencyMonths: 12 },

const PROFILE_CONFIG = {

  property_business_concentrated: '高房产或经营资产集中家庭',

};

const REQUIRED_FIELDS = [
  ['household.adults', '家庭成年人数'],
  ['household.children', '子女人数'],
  ['household.primaryAge', '家庭主要决策者年龄'],
  ['household.incomeSourceType', '收入来源类型'],
  ['household.incomeStability', '收入稳定性'],
  ['cashflow.monthlyIncome', '税后月收入'],
  ['cashflow.essentialMonthlyExpense', '月必要支出'],
  ['cashflow.monthlyDebtPayment', '每月偿债额'],
  ['assets.cash', '随时可用现金'],
  ['assets.bonds', '稳健类金融资产'],
  ['assets.equities', '权益类金融资产'],
  ['assets.property', '房产估值'],
  ['debts.total', '负债总额'],
  ['debts.highInterest', '高息负债余额'],
  ['goals.expensesWithin1Year', '一年内确定支出'],
  ['goals.expenses1To3Years', '一至三年确定支出'],
  ['protection.basicMedicalCovered', '基础医疗保障情况'],
  ['risk.investmentHorizonYears', '投资期限'],
  ['risk.maxAcceptableLossPct', '最大可接受亏损'],
  ['risk.marketDropReaction', '市场下跌反应'],
];

function getPath(value, path) {
  return path.split('.').reduce((current, key) => (
    current !== null && current !== undefined ? current[key] : undefined
  ), value);
}

function isProvided(value) {
  return value !== null && value !== undefined && value !== '';
}

function numberOrNull(value) {
  if (!isProvided(value)) return null;
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : null;
}

function nonNegativeOrNull(value) {
  const parsed = numberOrNull(value);
  return parsed === null ? null : Math.max(0, parsed);
}

function sumKnown(values) {
  return values.reduce((total, value) => total + (value === null ? 0 : value), 0);
}

function round(value, digits = 2) {
  if (!Number.isFinite(value)) return null;
  const factor = 10 ** digits;
  return Math.round(value * factor) / factor;
}

function clamp(value, minimum, maximum) {
  return Math.min(maximum, Math.max(minimum, value));
}

function normalizeInput(input = {}) {
  const household = input.household || {};
  const cashflow = input.cashflow || {};
  const assets = input.assets || {};
  const debts = input.debts || {};
  const goals = input.goals || {};
  const protection = input.protection || {};
  const risk = input.risk || {};

  return {
    household: {
      adults: nonNegativeOrNull(household.adults),
      children: nonNegativeOrNull(household.children),
      elderlyDependents: nonNegativeOrNull(household.elderlyDependents),
      primaryAge: nonNegativeOrNull(household.primaryAge),
      incomeSourceType: isProvided(household.incomeSourceType) ? household.incomeSourceType : null,
      incomeStability: isProvided(household.incomeStability) ? household.incomeStability : null,
      yearsToRetirement: nonNegativeOrNull(household.yearsToRetirement),
      retired: household.retired === true,
    },
    cashflow: {
      monthlyIncome: nonNegativeOrNull(cashflow.monthlyIncome),
      essentialMonthlyExpense: nonNegativeOrNull(cashflow.essentialMonthlyExpense),
      monthlyDebtPayment: nonNegativeOrNull(cashflow.monthlyDebtPayment),
      incomeShockPct: nonNegativeOrNull(cashflow.incomeShockPct),
    },
    assets: {
      cash: nonNegativeOrNull(assets.cash),
      bonds: nonNegativeOrNull(assets.bonds),
      equities: nonNegativeOrNull(assets.equities),
      gold: nonNegativeOrNull(assets.gold),
      property: nonNegativeOrNull(assets.property),
      business: nonNegativeOrNull(assets.business),
      otherLiquid: nonNegativeOrNull(assets.otherLiquid),
    },
    debts: {
      total: nonNegativeOrNull(debts.total),
      highInterest: nonNegativeOrNull(debts.highInterest),
      highestRate: nonNegativeOrNull(debts.highestRate),
    },
    goals: {
      expensesWithin1Year: nonNegativeOrNull(goals.expensesWithin1Year),
      expenses1To3Years: nonNegativeOrNull(goals.expenses1To3Years),
      homePurchaseWithinYears: nonNegativeOrNull(goals.homePurchaseWithinYears),
    },
    protection: {
      basicMedicalCovered: typeof protection.basicMedicalCovered === 'boolean'
        ? protection.basicMedicalCovered
        : null,
      lifeCoverageGap: nonNegativeOrNull(protection.lifeCoverageGap),
    },
    risk: {
      investmentHorizonYears: nonNegativeOrNull(risk.investmentHorizonYears),
      maxAcceptableLossPct: nonNegativeOrNull(risk.maxAcceptableLossPct),
      marketDropReaction: isProvided(risk.marketDropReaction) ? risk.marketDropReaction : null,
      largestHoldingPct: nonNegativeOrNull(risk.largestHoldingPct),
      singleMarketPct: nonNegativeOrNull(risk.singleMarketPct),
    },
  };
}

function assessCompleteness(normalized) {
  const missingFields = REQUIRED_FIELDS
    .filter(([path]) => !isProvided(getPath(normalized, path)))
    .map(([path]) => path);
  const missingLabels = REQUIRED_FIELDS
    .filter(([path]) => missingFields.includes(path))
    .map(([, label]) => label);
  const completed = REQUIRED_FIELDS.length - missingFields.length;
  const score = Math.round((completed / REQUIRED_FIELDS.length) * 100);

  return {
    score,
    completedFields: completed,
    totalFields: REQUIRED_FIELDS.length,
    missingFields,
    missingLabels,
    isSufficient: score >= 80
      && isProvided(normalized.cashflow.monthlyIncome)
      && isProvided(normalized.cashflow.essentialMonthlyExpense)
      && isProvided(normalized.assets.cash)
      && isProvided(normalized.risk.maxAcceptableLossPct),
  };
}

function identifyLifecycle(data) {
  const { household, goals } = data;
  let key = 'general';

  if (household.retired || household.incomeSourceType === 'pension') {
    key = 'retired';
  } else if (household.yearsToRetirement !== null && household.yearsToRetirement <= 5) {
    key = 'near_retirement';
  } else if (goals.homePurchaseWithinYears !== null && goals.homePurchaseWithinYears <= 3) {
    key = 'home_purchase';
  } else if (household.incomeSourceType === 'self_employed' || household.incomeStability === 'volatile') {
    key = 'self_employed_variable';
  } else if ((household.children || 0) + (household.elderlyDependents || 0) > 0
    && household.incomeSourceType === 'single_salary') {
    key = 'single_income_dependents';
  } else if ((household.children || 0) > 0
    && ['dual_salary', 'multiple'].includes(household.incomeSourceType)) {
    key = 'dual_income_parent';
  } else if ((household.adults || 0) === 1 && (household.primaryAge || 0) <= 35) {
    key = 'young_single';
  }

  return { key, ...LIFECYCLE_CONFIG[key] };
}

function deriveMetrics(data, lifecycle) {
  const { cashflow, assets, debts, goals } = data;
  const monthlyNeed = cashflow.essentialMonthlyExpense === null
    ? null
    : cashflow.essentialMonthlyExpense + (cashflow.monthlyDebtPayment || 0);
  const monthlySurplus = cashflow.monthlyIncome === null || monthlyNeed === null
    ? null
    : cashflow.monthlyIncome - monthlyNeed;
  const debtServiceRatio = cashflow.monthlyIncome === null || cashflow.monthlyIncome === 0
    ? (cashflow.monthlyDebtPayment > 0 ? 100 : 0)
    : ((cashflow.monthlyDebtPayment || 0) / cashflow.monthlyIncome) * 100;
  const liquidFinancialAssets = sumKnown([
    assets.cash,
    assets.bonds,
    assets.equities,
    assets.gold,
    assets.otherLiquid,
  ]);
  const totalAssets = liquidFinancialAssets + (assets.property || 0) + (assets.business || 0);
  const netWorth = debts.total === null ? null : totalAssets - debts.total;
  const cashCoverageMonths = monthlyNeed === null
    ? null
    : (monthlyNeed > 0 ? (assets.cash || 0) / monthlyNeed : null);
  const emergencyTarget = monthlyNeed === null ? null : monthlyNeed * lifecycle.emergencyMonths;
  const propertyConcentration = totalAssets > 0 ? ((assets.property || 0) / totalAssets) * 100 : 0;
  const businessToLiquidRatio = liquidFinancialAssets > 0
    ? ((assets.business || 0) / liquidFinancialAssets) * 100
    : ((assets.business || 0) > 0 ? 100 : 0);
  const equityRatio = liquidFinancialAssets > 0
    ? ((assets.equities || 0) / liquidFinancialAssets) * 100
    : 0;
  const shortTermExpenses = goals.expensesWithin1Year === null || goals.expenses1To3Years === null
    ? null
    : goals.expensesWithin1Year + goals.expenses1To3Years;

  return {
    monthlyNeed,
    monthlySurplus,
    debtServiceRatio: round(debtServiceRatio),
    liquidFinancialAssets,
    totalAssets,
    netWorth,
    cashCoverageMonths: round(cashCoverageMonths),
    emergencyTarget,
    propertyConcentration: round(propertyConcentration),
    businessToLiquidRatio: round(businessToLiquidRatio),
    equityRatio: round(equityRatio),
    shortTermExpenses,
  };
}

function findConstraints(data, metrics) {
  const constraints = [];
  const priorityRanks = {
    high_interest_debt: 1,
    negative_cashflow: 2,
    debt_service_overload: 3,
    emergency_reserve_critical: 4,
    protection_gap: 5,
    emergency_reserve_low: 6,
    property_concentration: 7,
    business_concentration: 8,
    market_concentration: 9,
  };
  const add = (code, severity, title) => constraints.push({
    code,
    severity,
    title,
    priorityRank: priorityRanks[code],
  });

  if (metrics.monthlySurplus !== null && metrics.monthlySurplus <= 0) {
    add('negative_cashflow', 'critical', '月度现金流无法覆盖必要支出');
  }
  if ((data.debts.highInterest || 0) > 0
    && ((data.debts.highestRate || 0) >= 8
      || data.debts.highInterest >= (data.cashflow.monthlyIncome || 0))) {
    add('high_interest_debt', 'critical', '存在需要优先处理的高息负债');
  }
  if ((metrics.debtServiceRatio || 0) >= 50) {
    add('debt_service_overload', 'critical', '月度偿债占收入比例过高');
  }
  if (metrics.cashCoverageMonths !== null
    && metrics.cashCoverageMonths < 3) {
    add('emergency_reserve_critical', 'critical', '应急资金不足三个月');
  } else if (metrics.cashCoverageMonths !== null
    && metrics.cashCoverageMonths < 6) {
    add('emergency_reserve_low', 'warning', '应急资金低于基础安全线');
  }
  if (data.protection.basicMedicalCovered === false || (data.protection.lifeCoverageGap || 0) > 0) {
    add('protection_gap', 'warning', '家庭保障存在缺口');
  }
  if (metrics.propertyConcentration >= 70) {
    add('property_concentration', 'warning', '房产占家庭总资产比例较高');
  }
  if (metrics.businessToLiquidRatio >= 50) {
    add('business_concentration', 'warning', '经营资产相对可变现金融资产较高');
  }
  if ((data.risk.largestHoldingPct || 0) >= 40 || (data.risk.singleMarketPct || 0) >= 60) {
    add('market_concentration', 'warning', '金融资产存在单一持仓或市场集中');
  }

  return constraints.sort((left, right) => left.priorityRank - right.priorityRank);
}

function assessRisk(data, metrics, constraints, completeness) {
  if (!completeness.isSufficient) {
    return {
      capacity: { level: null, label: '待补充资料' },
      willingness: { level: null, label: '待补充资料' },
      actualExposure: { level: null, label: '待补充资料', observedRiskLevel: null },
      finalLevel: null,
      finalLabel: '待评估',
      method: '三维最低值法',
    };
  }

  let capacityLevel = 3;
  if ((data.risk.investmentHorizonYears || 0) >= 10) capacityLevel += 1;
  if ((metrics.cashCoverageMonths || 0) >= 12) capacityLevel += 1;
  if (['dual_salary', 'multiple'].includes(data.household.incomeSourceType)) capacityLevel += 1;
  if (data.household.incomeStability === 'volatile' || data.household.incomeSourceType === 'self_employed') capacityLevel -= 1;
  if ((metrics.debtServiceRatio || 0) >= 30) capacityLevel -= 1;
  if (data.household.retired || data.household.incomeSourceType === 'pension') capacityLevel = Math.min(capacityLevel, 2);
  if (constraints.some(item => item.severity === 'critical')) capacityLevel = 1;
  capacityLevel = clamp(capacityLevel, 1, 5);

  const acceptedLoss = data.risk.maxAcceptableLossPct || 0;
  let willingnessLevel = acceptedLoss < 10 ? 1
    : acceptedLoss < 15 ? 2
      : acceptedLoss < 25 ? 3
        : acceptedLoss < 35 ? 4
          : 5;
  if (data.risk.marketDropReaction === 'panic_sell') willingnessLevel = 1;
  if (data.risk.marketDropReaction === 'reduce') willingnessLevel = Math.min(willingnessLevel, 2);

  const observedRiskLevel = metrics.equityRatio < 20 ? 1
    : metrics.equityRatio < 40 ? 2
      : metrics.equityRatio < 60 ? 3
        : metrics.equityRatio < 75 ? 4
          : 5;
  let exposureLevel = 5;
  if (metrics.equityRatio >= 80) exposureLevel = 2;
  else if (metrics.equityRatio >= 65) exposureLevel = 3;
  if (constraints.some(item => item.code === 'market_concentration')) exposureLevel = Math.min(exposureLevel, 2);
  if (constraints.some(item => ['property_concentration', 'business_concentration'].includes(item.code))) {
    exposureLevel = Math.min(exposureLevel, 3);
  }
  if (constraints.some(item => item.severity === 'critical')) exposureLevel = 1;

  const finalLevel = Math.min(capacityLevel, willingnessLevel, exposureLevel);
  return {
    capacity: { level: capacityLevel, label: RISK_LABELS[capacityLevel] },
    willingness: { level: willingnessLevel, label: RISK_LABELS[willingnessLevel] },
    actualExposure: {
      level: exposureLevel,
      label: RISK_LABELS[exposureLevel],
      observedRiskLevel,
      equityRatio: metrics.equityRatio,
    },
    finalLevel,
    finalLabel: RISK_LABELS[finalLevel],
    method: '三维最低值法',
  };
}

function calculateInvestable(data, metrics, lifecycle, completeness, constraints) {
  if (!completeness.isSufficient || metrics.shortTermExpenses === null || metrics.emergencyTarget === null) {
    return {
      safeUpperBound: null,
      liquidFinancialAssets: metrics.liquidFinancialAssets,
      reservedForEmergency: metrics.emergencyTarget,
      reservedForShortTermGoals: metrics.shortTermExpenses,
      reservedForHighInterestDebt: data.debts.highInterest,
      emergencyMonths: lifecycle.emergencyMonths,
      status: 'insufficient_information',
    };
  }

  const hasCashflowStop = constraints.some(item => item.code === 'negative_cashflow');
  const upperBound = hasCashflowStop ? 0 : Math.max(
    0,
    metrics.liquidFinancialAssets
      - metrics.emergencyTarget
      - metrics.shortTermExpenses
      - (data.debts.highInterest || 0)
  );

  return {
    safeUpperBound: round(upperBound, 0),
    liquidFinancialAssets: round(metrics.liquidFinancialAssets, 0),
    reservedForEmergency: round(metrics.emergencyTarget, 0),
    reservedForShortTermGoals: round(metrics.shortTermExpenses, 0),
    reservedForHighInterestDebt: round(data.debts.highInterest || 0, 0),
    emergencyMonths: lifecycle.emergencyMonths,
    status: upperBound > 0 ? 'available' : 'no_safe_surplus',
  };
}

function getAllocationRanges(risk, constraints) {
  if (risk.finalLevel === null) return null;
  const ranges = {
    1: { safety: [60, 75], stable: [15, 25], growth: [0, 10], hedge: [5, 10] },
    2: { safety: [45, 60], stable: [20, 30], growth: [10, 20], hedge: [5, 10] },
    3: { safety: [30, 45], stable: [20, 30], growth: [25, 40], hedge: [5, 10] },
    4: { safety: [20, 35], stable: [15, 25], growth: [40, 55], hedge: [5, 10] },
    5: { safety: [15, 25], stable: [10, 20], growth: [55, 70], hedge: [5, 10] },
  }[risk.finalLevel];

  const criticalDebt = constraints.some(item => [
    'high_interest_debt',
    'debt_service_overload',
    'negative_cashflow',
  ].includes(item.code));
  if (criticalDebt) ranges.growth = [0, 0];

  const format = ([min, max], label) => ({ min, max, label });
  return {
    safety: format(ranges.safety, '安全流动层'),
    stable: format(ranges.stable, '稳健收益层'),
    growth: format(ranges.growth, '长期成长层'),
    hedge: format(ranges.hedge, '风险对冲层'),
    note: '区间用于家庭大类资产规划，不构成具体产品推荐。',
  };
}

function buildStress(data, metrics, constraints) {
  if (metrics.monthlyNeed === null || metrics.monthlyNeed <= 0) {
    return {
      cashCoverageMonths: metrics.cashCoverageMonths,
      stressedCoverageMonths: null,
      status: 'insufficient_information',
      message: '补充必要支出后才能计算家庭现金流压力。',
    };
  }
  const shockPct = clamp(data.cashflow.incomeShockPct === null ? 50 : data.cashflow.incomeShockPct, 0, 100);
  const shockBurden = metrics.monthlyNeed + ((data.cashflow.monthlyIncome || 0) * shockPct / 100);
  const stressedCoverageMonths = shockBurden > 0 ? (data.assets.cash || 0) / shockBurden : null;
  const hasConcentration = constraints.some(item => item.code.includes('concentration'));
  const critical = constraints.some(item => item.severity === 'critical');
  const status = critical ? 'critical'
    : stressedCoverageMonths !== null && stressedCoverageMonths < 6 ? 'warning'
      : hasConcentration ? 'warning'
        : 'resilient';
  let message = status === 'critical'
    ? '现金流或债务红线会放大收入中断冲击，应先修复家庭安全底座。'
    : `按收入下降 ${shockPct}% 的保守情景，现金压力覆盖约 ${round(stressedCoverageMonths, 1)} 个月。`;
  if (hasConcentration) message += ' 房产、经营或市场集中会降低应急变现能力。';

  return {
    cashCoverageMonths: metrics.cashCoverageMonths,
    stressedCoverageMonths: round(stressedCoverageMonths),
    incomeShockPct: shockPct,
    status,
    message,
  };
}

    debt_service_overload: ['reduce_debt_service', '降低月度偿债压力', '优先降低月供占收入比例，避免收入中断时出现资金链风险。'],
    emergency_reserve_critical: ['build_emergency_reserve', '补足应急资金', `先建立至少 ${lifecycle.emergencyMonths} 个月必要支出的安全储备。`],

    protection_gap: ['close_protection_gap', '补齐基础保障缺口', '先覆盖可能击穿家庭资产负债表的医疗和家庭责任风险。'],
    property_concentration: ['reduce_property_concentration', '降低房产集中风险', '新增结余优先补充高流动性金融资产，避免继续放大不动产集中。'],

    market_concentration: ['diversify_financial_exposure', '降低金融资产集中度', '按市场和风险来源分散长期资产，设置单一暴露上限。'],

  const [code, title, detail] = actions[constraint.code] || ['review_constraint', constraint.title, '优先处理该项约束后再提高风险暴露。'];

function buildActions(completeness, constraints, lifecycle, risk) {
  const actions = [];
  if (!completeness.isSufficient) {
    actions.push({
      code: 'complete_information',
      title: '先补齐关键家庭资料',
      detail: `仍需补充：${completeness.missingLabels.slice(0, 4).join('、') || '关键风险信息'}。`,
      priority: 'critical',
    });
  }
  constraints.forEach(item => actions.push(actionForConstraint(item, lifecycle)));
  actions.push(lifecycleAction(lifecycle));
  if (risk.finalLevel !== null) {
    actions.push({
      code: 'align_risk_exposure',
      title: '按最低风险维度校准配置',
      detail: `风险能力、意愿与现有暴露适配度取最低值，当前建议以“${risk.finalLabel}”作为上限。`,
      priority: 'normal',
    });
  }
  actions.push({
    code: 'review_quarterly',
    title: '在家庭情况变化后复评',
    detail: '收入、负债、家庭成员或重大目标变化时重新评估，至少每季度复核一次。',
    priority: 'normal',
  });

  const unique = [];
  const seen = new Set();
  actions.forEach(action => {
    if (!seen.has(action.code)) {
      seen.add(action.code);
      unique.push(action);
    }
  });
  return unique.slice(0, 3);
}

function chooseProfile(lifecycle, constraints) {
  const highDebt = constraints.some(item => ['high_interest_debt', 'debt_service_overload'].includes(item.code));
  const cashflowPressure = constraints.some(item => ['negative_cashflow', 'emergency_reserve_critical'].includes(item.code));
  const concentrated = constraints.some(item => ['property_concentration', 'business_concentration'].includes(item.code));
  const protectionGap = constraints.some(item => item.code === 'protection_gap');
  let key = lifecycle.key;
  if (highDebt) key = 'high_debt_pressure';
  else if (cashflowPressure) key = 'cashflow_pressure';
  else if (concentrated) key = 'property_business_concentrated';
  else if (protectionGap) key = 'protection_gap';

  return {
    key,
    title: PROFILE_CONFIG[key] || lifecycle.title,
    lifecycleKey: lifecycle.key,
    constraintCodes: constraints.map(item => item.code),
  };
}

/**
 * 快速评估家庭风险与大类资产规划边界。
 *
 * 返回结果只给出家庭风险顺序和大类配置区间，不涉及具体产品。
 * 所有缺失数值保留为 null；0 被视为用户明确填写的合法数值。
 */
function assessFamily(input = {}) {
  const normalized = normalizeInput(input);
  const completeness = assessCompleteness(normalized);
  const lifecycle = identifyLifecycle(normalized);
  const metrics = deriveMetrics(normalized, lifecycle);
  const constraints = findConstraints(normalized, metrics);
  const redLines = constraints.filter(item => item.severity === 'critical');
  const risk = assessRisk(normalized, metrics, constraints, completeness);
  const investable = calculateInvestable(
    normalized,
    metrics,
    lifecycle,
    completeness,
    constraints
  );
  const allocationRanges = getAllocationRanges(risk, constraints);
  const stress = buildStress(normalized, metrics, constraints);

  return {
    version: 1,
    normalized,
    lifecycle,
    profile: chooseProfile(lifecycle, constraints),
    completeness,
    constraints,
    redLines,
    metrics,
    risk,
    investable,
    allocationRanges,
    stress,
    topActions: buildActions(completeness, constraints, lifecycle, risk),
    disclaimer: '本结果用于家庭财务规划与风险教育，不构成具体投资产品建议。',
  };
}

function finiteOr(value, fallback = 0) {
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric : fallback;
}

function marketLabel(market) {
  return { CN: 'A股', HK: '港股', US: '美股', GLOBAL: '全球' }[market] || market || '其他';
}

function buildAssetsFromMarketData(assetConfigs = [], livePayload = {}, existingAssets = {}) {
  const liveData = livePayload?.data || {};
  const configs = Array.isArray(assetConfigs) ? assetConfigs : [];
  const configCodes = configs.map(config => config?.code).filter(Boolean).sort();
  const existingCodes = Object.keys(existingAssets || {}).sort();
  const existingWeightTotal = Object.values(existingAssets || {}).reduce(
    (sum, asset) => sum + finiteOr(asset?.weight, 0),
    0
  );
  const preserveExistingWeights = configCodes.length === existingCodes.length
    && configCodes.every((code, index) => code === existingCodes[index])
    && Math.abs(existingWeightTotal - 100) <= 0.01;
  return configs.reduce((result, config) => {
    if (!config?.code) return result;
    const live = liveData[config.code] || {};
    const existing = existingAssets[config.code] || {};
    const role = ROLE_META[config.role] || { category: 'Other', bucket: 'growth', style: config.role || '其他' };
    const liveYield = Number(live.yield);
    const hasVerifiedYield = Number.isFinite(liveYield) && liveYield >= 0;
    const liveMonths = live.distribution_months && Object.keys(live.distribution_months).length > 0
      ? live.distribution_months
      : null;
    result[config.code] = {
      ...existing,
      name: config.name,
      type: config.type || 'ETF',
      weight: preserveExistingWeights
        ? (existing.weight ?? finiteOr(config.weight, 0))
        : finiteOr(config.weight, 0),
      yield: hasVerifiedYield ? liveYield : finiteOr(config.estimated_yield, 0),
      months: liveMonths || config.distribution_months || {},
      market: marketLabel(config.market),
      category: role.category,
      style: role.style,
      bucket: role.bucket,
      targetIndexCode: config.target_index_code || null,
      price: Number.isFinite(Number(live.price)) ? Number(live.price) : null,
      priceAsOf: live.price_as_of || config.price_as_of || '',
      yieldAsOf: live.distribution_as_of || config.distribution_as_of || '',
      yieldMethod: hasVerifiedYield ? live.yield_method : config.yield_method,
      dataQuality: hasVerifiedYield ? 'verified_trailing' : 'planning_assumption',
      strategyNote: config.strategy_note || '',
      riskNote: config.risk_note || ''
    };
    return result;
  }, {});
}

function latestRowsByCode(history = []) {
  const latest = new Map();
  for (const row of Array.isArray(history) ? history : []) {
    if (!row?.index_code || !row?.date) continue;
    const previous = latest.get(row.index_code);
    if (!previous || row.date > previous.date) latest.set(row.index_code, row);
  }
  return latest;
}

function percentile(values, value) {
  const finite = values.map(Number).filter(Number.isFinite).sort((a, b) => a - b);
  if (!finite.length || !Number.isFinite(Number(value))) return null;
  const count = finite.filter(item => item <= Number(value)).length;
  return Math.round((count / finite.length) * 1000) / 10;
}

function buildValuationIndices(history = [], baseIndices = [], referenceDate = new Date()) {
  const latest = latestRowsByCode(history);
  const rowsByCode = (Array.isArray(history) ? history : []).reduce((result, row) => {
    if (!row?.index_code) return result;
    (result[row.index_code] ||= []).push(row);
    return result;
  }, {});

  return (Array.isArray(baseIndices) ? baseIndices : []).map(base => {
    const row = latest.get(base.code);
    if (!row) return base;
    const peers = rowsByCode[base.code] || [];
    const pePercentile = finiteOr(row.pe_percentile_3y, percentile(peers.map(item => item.pe), row.pe));
    const pbPercentile = finiteOr(row.pb_percentile_3y, percentile(peers.map(item => item.pb), row.pb));
    const yieldPercentile = finiteOr(
      row.dividend_yield_percentile_3y,
      percentile(peers.map(item => item.dividend_yield), row.dividend_yield)
    );
    const defaultPercentile = base.type === 'dividend'
      ? yieldPercentile
      : Math.round(((pePercentile + pbPercentile) / 2) * 10) / 10;
    const asOfDate = new Date(`${row.date}T00:00:00`);
    const reference = referenceDate instanceof Date ? referenceDate : new Date(referenceDate);
    const staleDays = Number.isFinite(asOfDate.getTime()) && Number.isFinite(reference.getTime())
      ? Math.max(0, Math.floor((reference.getTime() - asOfDate.getTime()) / 86400000))
      : null;
    const isStale = staleDays !== null && staleDays > 21;
    return {
      ...base,
      pe: finiteOr(row.pe, base.pe),
      pb: finiteOr(row.pb, base.pb ?? 0),
      dividendYield: finiteOr(row.dividend_yield, base.dividendYield),
      pePercentile,
      pbPercentile,
      dividendYieldPercentile: yieldPercentile,
      defaultPercentile: isStale ? 50 : defaultPercentile,
      rawPercentile: defaultPercentile,
      isStale,
      staleDays,
      valuationAsOf: row.date,
      valuationSource: row.valuation_source || 'local_history'
    };
  });
}

}

  };
