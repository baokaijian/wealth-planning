function sumNumbers(values) {
  return values.reduce((total, value) => total + (Number.isFinite(Number(value)) ? Number(value) : 0), 0);
}

function buildFamilyAssessmentInput(state) {
  const quick = state.quick || {};
  const health = state.health || {};
  const assets = health.assetsBreakdown || {};
  const debt = state.debt || {};
  const expected = health.expectedExpenses || {};
  const debtTotal = quick.totalDebt ?? sumNumbers([
    debt.mortgageBalance,
    debt.carLoanBalance,
    debt.consumerLoanBalance,
    debt.businessLoanBalance
  ]);
  return {
    household: {
      adults: quick.adults,
      children: quick.children,
      elderlyDependents: quick.elderlyDependents,
      primaryAge: quick.primaryAge,
      incomeSourceType: quick.incomeSourceType,
      incomeStability: quick.incomeStability,
      yearsToRetirement: quick.yearsToRetirement,
      retired: quick.retired === true
    },
    cashflow: {
      monthlyIncome: health.monthlyIncome,
      essentialMonthlyExpense: health.essentialMonthlyExpense,
      monthlyDebtPayment: debt.monthlyDebtPayment,
      incomeShockPct: Math.max(0, 100 - Number(health.unemploymentReplacementRate || 0) * 100)
    },
    assets: {
      cash: sumNumbers([assets.cashCurrent, assets.cashShortDebt]),
      bonds: assets.bondAssets,
      equities: assets.equityAssets,
      gold: assets.goldAssets,
      property: state.property?.totalEstimatedValue ?? assets.propertyEstimated,
      business: quick.businessAssets,
      otherLiquid: sumNumbers([assets.pensionCashValue, assets.otherAssets])
    },
    debts: {
      total: debtTotal,
      highInterest: debt.highInterestDebtBalance,
      highestRate: quick.highestDebtRate
    },
    goals: {
      expensesWithin1Year: expected.expense1y,
      expenses1To3Years: expected.expense1To3y,
      homePurchaseWithinYears: quick.homePurchaseWithinYears
    },
    protection: {
      basicMedicalCovered: quick.basicMedicalCovered,
      lifeCoverageGap: 0
    },
    risk: {
      investmentHorizonYears: quick.investmentHorizonYears,
      maxAcceptableLossPct: quick.maxAcceptableLossPct,
      marketDropReaction: quick.marketDropReaction,
      largestHoldingPct: quick.largestHoldingPct,
      singleMarketPct: quick.singleMarketPct
    }
  };
}

function runFamilyAssessment(state) {
  return assessFamily(buildFamilyAssessmentInput(state));
}

function App() {
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return migrateState(parsed);
      }
    } catch (e) {
      console.error('Failed to load state from localStorage:', e);
    }
    return EMPTY_STATE;
  });

  const [activeTab, setActiveTab] = useState('quick');
  const [editingGoal, setEditingGoal] = useState(null);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [isAssetModalOpen, setIsAssetModalOpen] = useState(false);
  const [isGuideOpen, setIsGuideOpen] = useState(false);
  const [guideTab, setGuideTab] = useState('workflow');
  const [copySuccess, setCopySuccess] = useState(false);
  const [showBehaviorBreakdown, setShowBehaviorBreakdown] = useState(false);
  const [showScoreBreakdown, setShowScoreBreakdown] = useState(false);
  const [showFullTimeline, setShowFullTimeline] = useState(false);
  const [marketSnapshot, setMarketSnapshot] = useState({
    status: 'fallback',
    asOf: null,
    valuationAsOf: null,
    indices: THERMOMETER_INDICES,
    message: '正在读取仓库内最新缓存数据'
  });
  const fileInputRef = useRef(null);

  const [newAsset, setNewAsset] = useState({
    code: '',
    name: '',
    type: 'ETF',
    weight: 5.0,
    yield: 3.5,
    market: 'A股',
    category: 'Equity',
    style: '红利低波',
    bucket: 'growth',
    targetIndexCode: 'H30269'
  });

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Failed to save state to localStorage:', e);
    }
  }, [state]);

  // 只读取同源仓库 JSON；不发送任何家庭或用户数据。
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch('assets.json', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('assets.json');
        return response.json();
      }),
      fetch('live_data.json', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('live_data.json');
        return response.json();
      }),
      fetch('valuation_history.json', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('valuation_history.json');
        return response.json();
      })
    ]).then(([assetConfigs, livePayload, valuationHistory]) => {
      if (cancelled) return;
      const indices = buildValuationIndices(valuationHistory, THERMOMETER_INDICES);
      const valuationDates = indices.map(item => item.valuationAsOf).filter(Boolean).sort();
      setState(prev => ({
        ...prev,
        board: {
          ...prev.board,
          assets: buildAssetsFromMarketData(assetConfigs, livePayload, prev.board.assets)
        }
      }));
      setMarketSnapshot({
        status: livePayload.status === 'success' ? 'current' : 'fallback',
        asOf: livePayload.timestamp || null,
        valuationAsOf: valuationDates.at(-1) || null,
        indices,
        message: livePayload.status === 'success' ? '已载入仓库最新市场缓存' : '市场缓存状态异常，部分字段使用规划假设'
      });
    }).catch(error => {
      if (cancelled) return;
      setMarketSnapshot(prev => ({
        ...prev,
        status: 'fallback',
        message: `无法读取本地市场缓存（${error.message}），当前使用内置兜底数据`
      }));
    });
    return () => { cancelled = true; };
  }, []);

  // 派生量化指标计算
  const boardMetrics = useMemo(() => calculateBoardMetrics(state.board), [state.board]);
  const bufferMetrics = useMemo(() => calculateBufferSimulation(state.board), [state.board]);
  const debtMetrics = useMemo(() => calculateDebtDecisionMetrics(state.debt, state.board.growthRate), [state.debt, state.board.growthRate]);
  const insuranceMetrics = useMemo(() => calculateInsuranceGap(state.health, state.insurance, debtMetrics.totalDebtBalance), [state.health, state.insurance, debtMetrics.totalDebtBalance]);
  const pensionMetrics = useMemo(() => calculatePensionTaxBenefit(state.pension), [state.pension]);
  const realEstateMetrics = useMemo(() => calculateRealEstateRisk(state.property, state.health, state.debt), [state.property, state.health, state.debt]);
  const liquidityMetrics = useMemo(() => checkLiquiditySegregation(state.health, state.board.principal), [state.health, state.board.principal]);
  const concentrationMetrics = useMemo(() => checkTripleConcentration(state.board.assets), [state.board.assets]);
  const behaviorMetrics = useMemo(() => calculateBehavioralEquityCeiling(state.behavior, state.board.assets), [state.behavior, state.board.assets]);
  const familyAssessment = useMemo(() => runFamilyAssessment(state), [state]);
  
  // 温度计指标
  const activeThermometerIndex = useMemo(() => {
    const code = state.thermometer?.selectedIndex || 'H30269';
    return marketSnapshot.indices.find(i => i.code === code) || marketSnapshot.indices[0];
  }, [state.thermometer?.selectedIndex, marketSnapshot.indices]);

  const activePercentile = useMemo(() => {
    if (state.thermometer?.percentileOverrides && state.thermometer.percentileOverrides[activeThermometerIndex.code] !== undefined) {
      return state.thermometer.percentileOverrides[activeThermometerIndex.code];
    }
    return activeThermometerIndex.defaultPercentile || 50;
  }, [state.thermometer?.percentileOverrides, activeThermometerIndex]);

  const thermometerMetrics = useMemo(() => calculateThermometerSignal(activePercentile), [activePercentile]);

  // 多目标资源挤占推演 (P1-5)
  const totalPrincipalYuan = (state.board.principal ?? 0) * 10000;
  const multiGoalResult = useMemo(() => {
    return calculateMultiGoalProjections(
      state.goals,
      totalPrincipalYuan,
      state.health.monthlySurplus ?? 0,
      state.board.growthRate ?? 6.5,
      0.02
    );
  }, [state.goals, totalPrincipalYuan, state.health.monthlySurplus, state.board.growthRate]);

  const multiGoalProjections = useMemo(() => {
    return (multiGoalResult.goalResults || []).map(item => ({
      ...item,
      goal: item,
      allocatedMonthly: item.allocatedSurplus || 0,
      years: item.projection?.years || 1,
      months: item.projection?.months || 12,
      fvPrincipal: item.projection?.fvPrincipal || 0,
      fvMonthly: item.projection?.fvMonthly || 0,
      fvReserved: item.projection?.fvReserved || 0,
      fvTotal: item.projection?.fvTotal || 0,
      diff: item.projection?.diff || 0,
      isAchieved: item.projection?.isAchieved || false,
      gap: item.projection?.gap || 0,
      levers: item.projection?.levers || null
    }));
  }, [multiGoalResult]);

  // 资源池占用状态统计
  const poolStatus = useMemo(() => {
    let rigidPrincipalUsed = 0;
    let rigidMonthlyUsed = 0;
    let flexiblePrincipalUsed = 0;
    let flexibleMonthlyUsed = 0;

    multiGoalProjections.forEach(p => {
      if (p.priority === '刚性') {
        rigidPrincipalUsed += p.allocatedPrincipal;
        rigidMonthlyUsed += p.allocatedMonthly;
      } else {
        flexiblePrincipalUsed += p.allocatedPrincipal;
        flexibleMonthlyUsed += p.allocatedMonthly;
      }
    });

    const flexiblePrincipalAvailable = Math.max(0, totalPrincipalYuan - rigidPrincipalUsed);
    const flexibleMonthlyAvailable = Math.max(0, (state.health.monthlySurplus ?? 0) - rigidMonthlyUsed);
    const remainingPrincipal = Math.max(0, flexiblePrincipalAvailable - flexiblePrincipalUsed);
    const remainingMonthly = Math.max(0, flexibleMonthlyAvailable - flexibleMonthlyUsed);

    return {
      rigidPrincipalUsed,
      rigidMonthlyUsed,
      flexiblePrincipalAvailable,
      flexibleMonthlyAvailable,
      remainingPrincipal,
      remainingMonthly
    };
  }, [multiGoalProjections, totalPrincipalYuan, state.health.monthlySurplus]);

  // 四大复合情景同时联测推演
  const replacementRate = state.stress.unemploymentReplacementRate ?? 0.3;
  const fourStressSimulations = useMemo(() => {
    const std = runCompoundStressTest(state.board, STRESS_PRESETS.standard, state.health, 36, replacementRate);
    const sev = runCompoundStressTest(state.board, STRESS_PRESETS.severe, state.health, 36, replacementRate);
    const stag = runCompoundStressTest(state.board, STRESS_PRESETS.stagflation, state.health, 36, replacementRate);
    const rep = HISTORICAL_REPLAYS[state.stress.selectedReplayId] || HISTORICAL_REPLAYS.replay_2018;
    const hist = runCompoundStressTest(state.board, {
      id: rep.id,
      name: rep.name,
      unemploymentMonths: 0,
      dividendDropRate: 1 - rep.dividendFactor,
      equityDrawdownRate: Math.abs(Math.min(...rep.monthlyDrawdown)),
      monthlyDrawdown: rep.monthlyDrawdown,
      medicalExpense: 0,
      delayMonths: 0,
      inflationRate: 0
    }, state.health, 36, replacementRate);

    // 寻找最严酷情景
    const simList = [
      { key: 'severe', name: '严重复合情景', sim: sev },
      { key: 'standard', name: '标准复合情景', sim: std },
      { key: 'stagflation', name: '滞胀情景', sim: stag },
      { key: 'replay', name: rep.name, sim: hist }
    ];

    simList.sort((a, b) => {
      if (a.sim.isExhausted && !b.sim.isExhausted) return -1;
      if (!a.sim.isExhausted && b.sim.isExhausted) return 1;
      if (a.sim.isExhausted && b.sim.isExhausted) {
        if (a.sim.exhaustionMonth !== b.sim.exhaustionMonth) return a.sim.exhaustionMonth - b.sim.exhaustionMonth;
        return b.sim.minAssetToSell - a.sim.minAssetToSell;
      }
      return a.sim.minBuffer - b.sim.minBuffer;
    });

    return {
      standard: std,
      severe: sev,
      stagflation: stag,
      replay: hist,
      worst: simList[0]
    };
  }, [state.board, state.health, replacementRate, state.stress.selectedReplayId]);

  // 当前激活展示的压力测试情景
  const currentStressScenario = useMemo(() => {
    if (state.stress.scenarioType === 'preset') {
      return STRESS_PRESETS[state.stress.selectedPresetId] || STRESS_PRESETS.standard;
    } else {
      const rep = HISTORICAL_REPLAYS[state.stress.selectedReplayId] || HISTORICAL_REPLAYS.replay_2018;
      return {
        id: rep.id,
        name: rep.name,
        description: rep.description,
        unemploymentMonths: 0,
        dividendDropRate: 1 - rep.dividendFactor,
        equityDrawdownRate: Math.abs(Math.min(...rep.monthlyDrawdown)),
        monthlyDrawdown: rep.monthlyDrawdown,
        medicalExpense: 0,
        medicalMonth: 0,
        delayMonths: 0,
        inflationRate: 0.0
      };
    }
  }, [state.stress]);

  const activeStressMetrics = useMemo(() => {
    return runCompoundStressTest(state.board, currentStressScenario, state.health, 36, replacementRate);
  }, [state.board, currentStressScenario, state.health, replacementRate]);

  // 增量资金再平衡计算
  const incrementalRebalance = useMemo(() => {
    return calculateIncrementalRebalance(
      state.board?.assets,
      state.thermometer?.userHoldings,
      state.thermometer?.incrementalCapital || 50000
    );
  }, [state.board?.assets, state.thermometer?.userHoldings, state.thermometer?.incrementalCapital]);

  const explainableScores = useMemo(() => calculateExplainableScores(state), [state]);
  const unifiedDashboard = useMemo(() => calculateUnifiedRiskDashboard(state), [state]);

  // 资产三桶统计
  const bucketSummary = useMemo(() => {
    let safety = 0;
    let growth = 0;
    let hedge = 0;
    Object.values(state.board.assets || {}).forEach(a => {
      const w = a.weight || 0;
      if (a.bucket === 'safety' || a.category === 'Cash') safety += w;
      else if (a.bucket === 'hedge' || a.category === 'Gold' || a.style === '利率长债') hedge += w;
      else growth += w;
    });
    return { safety, growth, hedge };
  }, [state.board.assets]);

  // 一键归一化权重至 100%
  const handleNormalizeWeights = () => {
    const assets = { ...state.board.assets };
    const keys = Object.keys(assets);
    if (keys.length === 0) return;
    const sum = Object.values(assets).reduce((acc, a) => acc + (Number(a.weight) || 0), 0);
    if (sum <= 0) return;
    let runningSum = 0;
    keys.forEach((code, idx) => {
      if (idx === keys.length - 1) {
        assets[code] = { ...assets[code], weight: Math.round((100.0 - runningSum) * 10) / 10 };
      } else {
        const normalized = Math.round(((assets[code].weight || 0) / sum) * 1000) / 10;
        assets[code] = { ...assets[code], weight: normalized };
        runningSum += normalized;
      }
    });
    setState(prev => ({
      ...prev,
      board: { ...prev.board, assets }
    }));
  };

  // 导出 JSON
  const handleExportJSON = () => {
    const jsonStr = JSON.stringify(state, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `wealth_planning_backup_${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
  };

  // 导入 JSON
  const handleImportJSON = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        const migrated = migrateState(parsed);
        setState(migrated);
        alert('配置已成功自本地文件恢复！');
      } catch (err) {
        alert('导入失败：文件不是合法的 JSON 数据！');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // 保存快照
  const handleSaveSnapshot = () => {
    try {
      const snapsRaw = localStorage.getItem('WEALTH_PLANNING_SNAPSHOTS_V1') || '[]';
      const snaps = JSON.parse(snapsRaw);
      snaps.unshift({
        timestamp: new Date().toISOString(),
        label: `快照 ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`,
        state
      });
      localStorage.setItem('WEALTH_PLANNING_SNAPSHOTS_V1', JSON.stringify(snaps.slice(0, 10)));
      alert('历史快照已保存在本地浏览器！');
    } catch (err) {
      console.error(err);
    }
  };

  const updateQuick = (field, value) => {
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      quick: { ...prev.quick, [field]: value }
    }));
  };

  const updateHealth = (field, value) => {
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      health: { ...prev.health, [field]: value }
    }));
  };

  const updateAssetBreakdown = (field, value) => {
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      health: {
        ...prev.health,
        assetsBreakdown: { ...prev.health.assetsBreakdown, [field]: value }
      }
    }));
  };

  const updateExpectedExpense = (field, value) => {
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      health: {
        ...prev.health,
        expectedExpenses: { ...prev.health.expectedExpenses, [field]: value }
      }
    }));
  };

  const updateDebt = (field, value) => {
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      debt: { ...prev.debt, [field]: value }
    }));
  };

  const handleTemplateChange = (templateKey) => {
    const template = HOUSEHOLD_TEMPLATES[templateKey];
    setState(prev => ({
      ...prev,
      meta: { ...prev.meta, assessmentCompleted: false, isDemo: false },
      quick: {
        ...prev.quick,
        ...(template || {}),
        householdStage: templateKey
      }
    }));
  };

  const handleRunQuickAssessment = () => {
    const result = runFamilyAssessment(state);
    if (!result.completeness.isSufficient) {
      alert(`资料尚不足以生成结论，请补充：${result.completeness.missingLabels.slice(0, 6).join('、')}`);
      setState(prev => ({
        ...prev,
        meta: { ...prev.meta, assessmentCompleted: false, isDemo: false }
      }));
      return;
    }
    const monthlyNeed = Math.max(0, Number(result.metrics.monthlyNeed || 0));
    const emergency = Math.max(0, Number(result.investable.reservedForEmergency || 0));
    const investable = Math.max(0, Number(result.investable.safeUpperBound || 0));
    setState(prev => ({
      ...prev,
      meta: {
        ...prev.meta,
        assessmentCompleted: true,
        isDemo: false,
        assessedAt: new Date().toISOString()
      },
      health: {
        ...prev.health,
        monthlyExpense: monthlyNeed,
        monthlySurplus: Number(result.metrics.monthlySurplus || 0)
      },
      board: {
        ...prev.board,
        principal: (emergency + investable) / 10000,
        bufferSeed: emergency / 10000,
        targetMonthly: Number(prev.health.essentialMonthlyExpense || 0) / 10000
      }
    }));
  };

  const handleLoadDemo = () => {
    setState(prev => ({
      ...INITIAL_STATE,
      board: {
        ...INITIAL_STATE.board,
        assets: prev.board.assets
      }
    }));
    setActiveTab('quick');
  };

  const setBufferCoverageMonths = (months) => {
    const monthlyNeed = Math.max(0, Number(state.health.essentialMonthlyExpense || 0) + Number(state.debt.monthlyDebtPayment || 0));
    const targetWan = monthlyNeed * months / 10000;
    setState(prev => ({
      ...prev,
      board: {
        ...prev.board,
        bufferSeed: Math.min(Math.max(0, Number(prev.board.principal || 0)), targetWan)
      }
    }));
  };

  const applyBufferScenario = (scenarioId) => {
    setState(prev => ({
      ...prev,
